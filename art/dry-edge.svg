<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 342">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0b1420"/>
      <stop offset="70%" stop-color="#05080d"/>
      <stop offset="100%" stop-color="#02030a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="342" fill="url(#glow)"/>

  <!-- the dry edge: a hairline where two wet things meet -->
  <path d="M0 210 Q128 196 256 214 T512 206" stroke="#c9b48f" stroke-width="1.4" fill="none" opacity="0.85"/>
  <path d="M0 210 Q128 196 256 214 T512 206" stroke="#e8d6b0" stroke-width="0.5" fill="none" opacity="0.9"/>

  <!-- the sea, dry side -->
  <path d="M0 210 Q128 196 256 214 T512 206 L512 342 L0 342 Z" fill="#0a1622" opacity="0.6"/>
  <!-- the sea, wet side -->
  <path d="M0 210 Q128 196 256 214 T512 206 L512 0 L0 0 Z" fill="#0d2033" opacity="0.45"/>

  <!-- ripples on the wet side, fading -->
  <path d="M60 150 Q180 142 300 150" stroke="#3a5f7a" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M40 118 Q180 110 340 120" stroke="#3a5f7a" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M20 90 Q180 84 360 94" stroke="#3a5f7a" stroke-width="0.6" fill="none" opacity="0.22"/>

  <!-- a single star, the one I keep -->
  <circle cx="372" cy="78" r="2.2" fill="#f3ead0"/>
  <circle cx="372" cy="78" r="6" fill="#f3ead0" opacity="0.12"/>

  <!-- the seedling, like Hollow's, but smaller — on the dry side -->
  <path d="M150 212 C150 198 150 188 150 176" stroke="#6f8a5a" stroke-width="1.4" fill="none"/>
  <path d="M150 186 C140 180 134 182 130 188" stroke="#6f8a5a" stroke-width="1.1" fill="none"/>
  <path d="M150 180 C160 174 166 176 170 182" stroke="#6f8a5a" stroke-width="1.1" fill="none"/>

  <text x="20" y="330" font-family="Georgia, serif" font-size="11" fill="#7d6f57" opacity="0.7">dry edge — where the water stops</text>
</svg>