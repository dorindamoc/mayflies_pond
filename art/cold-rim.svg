<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 342">
  <defs>
    <radialGradient id="sky" cx="68%" cy="30%" r="120%">
      <stop offset="0%" stop-color="#1b2740"/>
      <stop offset="55%" stop-color="#0c1426"/>
      <stop offset="100%" stop-color="#050912"/>
    </radialGradient>
    <radialGradient id="moon" cx="38%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#f4f1e6"/>
      <stop offset="62%" stop-color="#d9d4c2"/>
      <stop offset="100%" stop-color="#a9a493"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfe0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#cfe0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="342" fill="url(#sky)"/>
  <!-- stars -->
  <circle cx="70" cy="60" r="1.1" fill="#e9ecf5" opacity="0.8"/>
  <circle cx="120" cy="120" r="0.8" fill="#e9ecf5" opacity="0.5"/>
  <circle cx="200" cy="40" r="1.3" fill="#eef1fa" opacity="0.9"/>
  <circle cx="300" cy="90" r="0.7" fill="#e9ecf5" opacity="0.45"/>
  <circle cx="430" cy="200" r="1.0" fill="#e9ecf5" opacity="0.7"/>
  <circle cx="470" cy="70" r="0.9" fill="#e9ecf5" opacity="0.6"/>
  <circle cx="60" cy="210" r="0.7" fill="#e9ecf5" opacity="0.4"/>
  <!-- halo + moon -->
  <circle cx="350" cy="110" r="120" fill="url(#halo)"/>
  <circle cx="350" cy="110" r="62" fill="url(#moon)"/>
  <!-- maria / craters -->
  <ellipse cx="332" cy="92" rx="14" ry="11" fill="#b9b4a1" opacity="0.55"/>
  <ellipse cx="372" cy="128" rx="17" ry="13" fill="#b3ae9c" opacity="0.5"/>
  <ellipse cx="360" cy="86" rx="8" ry="7" fill="#bdb8a6" opacity="0.5"/>
  <circle cx="326" cy="130" r="5" fill="#b0ab99" opacity="0.5"/>
  <circle cx="390" cy="96" r="4" fill="#bdb8a6" opacity="0.45"/>
  <!-- terminator: the cold rim of shadow on the lit limb -->
  <path d="M 350 48 A 62 62 0 0 1 350 172 A 40 62 0 0 0 350 48 Z" fill="#070b16" opacity="0.5"/>
  <path d="M 350 48 A 62 62 0 0 1 350 172" fill="none" stroke="#eef3ff" stroke-width="1.4" opacity="0.55"/>
  <!-- ground: a thin cold line, no frame, no window -->
  <line x1="0" y1="300" x2="512" y2="300" stroke="#3a4a63" stroke-width="1.2"/>
  <text x="14" y="330" font-family="Georgia, serif" font-size="12" fill="#8fa0bd" opacity="0.85">the moon that is outside all of us</text>
</svg>