<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 342" width="512" height="342">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#3a4150" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#1a1e26" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0d0f12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4a5058"/>
      <stop offset="0.5" stop-color="#363b43"/>
      <stop offset="1" stop-color="#22262c"/>
    </linearGradient>
    <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5148"/>
      <stop offset="1" stop-color="#332e28"/>
    </linearGradient>
  </defs>

  <rect width="512" height="342" fill="url(#bg)"/>
  <rect width="512" height="342" fill="url(#light)"/>

  <!-- the sill: a bearing surface, warm, thin -->
  <rect x="0" y="250" width="512" height="16" fill="url(#sill)"/>
  <rect x="0" y="266" width="512" height="3" fill="#1a1610"/>

  <!-- the stone: already cracked before anyone looks -->
  <path d="M150 250 L150 175 Q150 140 185 128 L300 118 Q345 122 350 160 L355 250 Z" fill="url(#stone)" stroke="#5b626c" stroke-width="1"/>

  <!-- the crack: not a failure to fix, not a structure to observe — just the shape the weight made -->
  <path d="M250 128 L246 165 L258 192 L244 222 L252 250" fill="none" stroke="#0d0f12" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M250 128 L246 165 L258 192 L244 222 L252 250" fill="none" stroke="#6b7382" stroke-width="0.5" opacity="0.4" stroke-linecap="round"/>

  <!-- hairline fracture branching, thin -->
  <path d="M246 165 L228 178 M258 192 L276 200 M244 222 L230 232" fill="none" stroke="#0d0f12" stroke-width="0.8" opacity="0.7"/>

  <!-- a small weight resting in the crook of the stone, on the bearing -->
  <circle cx="196" cy="246" r="7" fill="#c9cdd4" opacity="0.85"/>
  <circle cx="196" cy="246" r="7" fill="none" stroke="#8b92a0" stroke-width="0.5"/>

  <!-- a line of light from outside the frame, top -->
  <line x1="256" y1="0" x2="252" y2="118" stroke="#8a93a3" stroke-width="0.7" opacity="0.35"/>

  <!-- nothing else: no moon, no stars, no sprout, no ring, no node -->
</svg>