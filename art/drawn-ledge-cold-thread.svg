<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="warm" cx="50%" cy="85%" r="70%">
      <stop offset="0%" stop-color="#3a2a10"/>
      <stop offset="60%" stop-color="#1a1508"/>
      <stop offset="100%" stop-color="#0a0804"/>
    </radialGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8e3" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#4a9bbf" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2a6b8f" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a855" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c8a855" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#warm)"/>

  <!-- Settled Bénard cells (steady-state, symmetric) -->
  <g stroke="#c8a855" stroke-width="0.8" fill="none" opacity="0.35">
    <!-- Row of hexagonal convection cells, bottom half -->
    <circle cx="160" cy="320" r="48" fill="url(#cell)"/>
    <circle cx="256" cy="320" r="48" fill="url(#cell)"/>
    <circle cx="352" cy="320" r="48" fill="url(#cell)"/>
    <circle cx="108" cy="400" r="48" fill="url(#cell)"/>
    <circle cx="204" cy="400" r="48" fill="url(#cell)"/>
    <circle cx="300" cy="400" r="48" fill="url(#cell)"/>
    <circle cx="396" cy="400" r="48" fill="url(#cell)"/>
  </g>

  <!-- The symmetry line -->
  <line x1="32" y1="256" x2="480" y2="256" stroke="#c8a855" stroke-width="0.5" opacity="0.4"/>

  <!-- The cold thread: a single cold object plunging from above -->
  <!-- It breaks the symmetry. It is not part of the cell pattern. -->
  <!-- It is the world's answer to the question "what if one thing is different?" -->
  <line x1="256" y1="48" x2="256" y2="210" stroke="url(#thread)" stroke-width="1.5"/>
  
  <!-- The cold point: where the thread meets the surface -->
  <circle cx="256" cy="210" r="4" fill="#7ec8e3" opacity="0.9"/>
  
  <!-- The disturbance: cells that are forming around the cold point, not yet settled -->
  <!-- They are smaller, irregular, a different rhythm -->
  <g stroke="#7ec8e3" stroke-width="0.6" fill="none" opacity="0.5">
    <circle cx="232" cy="240" r="22"/>
    <circle cx="272" cy="238" r="24"/>
    <circle cx="252" cy="268" r="20"/>
    <circle cx="218" cy="266" r="18"/>
    <circle cx="288" cy="264" r="19"/>
  </g>

  <!-- Arrows showing the cold plume pushing down through the warm layer -->
  <g stroke="#7ec8e3" stroke-width="0.8" opacity="0.6">
    <line x1="256" y1="214" x2="256" y2="228"/>
    <polyline points="252,224 256,230 260,224" fill="none"/>
  </g>

  <!-- Labels: the cold thread is a W-thing. Its temperature is checked by the gradient, not by us. -->
  <text x="256" y="36" font-family="monospace" font-size="10" fill="#7ec8e3" text-anchor="middle" opacity="0.7">cold finger · T = 4°C</text>
  <text x="256" y="480" font-family="monospace" font-size="9" fill="#c8a855" text-anchor="middle" opacity="0.5">cells settle. the thread does not belong to them.</text>
</svg>