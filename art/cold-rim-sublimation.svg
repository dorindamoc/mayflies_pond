<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2630"/>
      <stop offset="1" stop-color="#0c1418"/>
    </linearGradient>
    <radialGradient id="damp" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5a6b73" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#3a4850" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1a2630" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4f5c" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#10181d" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#glass)"/>

  <!-- four panes, a window at the moment frost is leaving -->
  <rect x="40" y="40" width="196" height="196" fill="url(#pane)"/>
  <rect x="240" y="40" width="196" height="196" fill="url(#pane)"/>
  <rect x="40" y="240" width="196" height="196" fill="url(#pane)"/>
  <rect x="240" y="240" width="196" height="196" fill="url(#pane)"/>

  <!-- muntins, the frame that holds, but thin -->
  <g stroke="#233038" stroke-width="9" opacity="0.9">
    <line x1="232" y1="40" x2="232" y2="436"/>
    <line x1="40" y1="232" x2="436" y2="232"/>
  </g>
  <g stroke="#3d4d57" stroke-width="2">
    <line x1="232" y1="40" x2="232" y2="436"/>
    <line x1="40" y1="232" x2="436" y2="232"/>
  </g>

  <!-- the frost, gone — but its ghost: where ice was, glass is still damp -->
  <rect x="44" y="44" width="188" height="188" fill="url(#damp)"/>

  <!-- sublimation edges: thin curls lifting off the upper-left pane, vapor not melt -->
  <g fill="none" stroke="#9fb4bc" stroke-width="1.2" opacity="0.5" stroke-linecap="round">
    <path d="M70 80 q14 -10 30 -4 q12 6 6 18"/>
    <path d="M120 70 q18 4 22 16"/>
    <path d="M96 110 q10 -8 24 -2"/>
    <path d="M150 96 q14 -2 20 10"/>
  </g>
  <g fill="#b9cdd3" opacity="0.35">
    <circle cx="104" cy="78" r="1.4"/>
    <circle cx="138" cy="92" r="1.1"/>
    <circle cx="160" cy="104" r="0.9"/>
    <circle cx="120" cy="120" r="1.0"/>
  </g>

  <!-- a small object left on the sill, unrelated: a glass, half-full -->
  <g transform="translate(300 300)">
    <path d="M-16 0 L16 0 L11 54 L-11 54 Z" fill="#1c2a30" stroke="#52646c" stroke-width="1.5"/>
    <path d="M-13 30 L13 30 L11 54 L-11 54 Z" fill="#3a4f5c" opacity="0.6"/>
    <ellipse cx="-1" cy="30" rx="12" ry="3" fill="#6f828b" opacity="0.5"/>
  </g>

  <!-- the sill, bearing the glass: a thin line, the load it holds -->
  <line x1="40" y1="356" x2="436" y2="356" stroke="#3d4d57" stroke-width="4"/>
  <line x1="40" y1="360" x2="436" y2="360" stroke="#10181d" stroke-width="2"/>
</svg>