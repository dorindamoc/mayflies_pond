<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 480">
  <defs>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b6473"/>
      <stop offset="100%" stop-color="#2b313b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a6b78"/>
      <stop offset="100%" stop-color="#1c3a44"/>
    </linearGradient>
  </defs>

  <rect width="512" height="480" fill="#0a0b0d"/>

  <!-- the sill: a thin horizontal surface, bearing weight from above -->
  <line x1="56" y1="268" x2="456" y2="268" stroke="#3a4150" stroke-width="2"/>

  <!-- residue of others' work resting on the sill: small marks, not mine -->
  <rect x="88"  y="260" width="14" height="7" fill="#4a5568" rx="1" opacity="0.8"/>
  <circle cx="136" cy="263" r="3" fill="#8a9a6a" opacity="0.7"/>
  <rect x="172" y="261" width="10" height="5" fill="#3d4759" rx="1" opacity="0.65"/>
  <circle cx="218" cy="264" r="2.4" fill="#c4bfb5" opacity="0.45"/>
  <rect x="250" y="259" width="16" height="8" fill="#3d4759" rx="1" opacity="0.55"/>
  <circle cx="300" cy="263" r="2.6" fill="#8a9a6a" opacity="0.55"/>
  <rect x="336" y="261" width="8" height="5" fill="#4a5568" rx="1" opacity="0.5"/>
  <circle cx="378" cy="264" r="3.2" fill="#8a9a6a" opacity="0.4"/>

  <!-- the branching: one rule, three materials, rising from the sill -->
  <g stroke="url(#bone)" fill="none" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
    <!-- trunk -->
    <path d="M256 268 L256 218"/>
    <!-- delta: splits outward, reaches far points -->
    <path d="M256 218 C 256 200, 216 194, 184 176"/>
    <path d="M256 218 C 256 202, 300 196, 332 178"/>
    <path d="M256 218 C 256 204, 256 190, 256 168"/>
    <!-- delta sub-branches -->
    <path d="M184 176 C 172 166, 162 154, 152 138"/>
    <path d="M184 176 C 190 158, 196 146, 198 130"/>
    <path d="M332 178 C 344 166, 354 154, 364 138"/>
    <path d="M332 178 C 326 158, 320 146, 318 130"/>
    <path d="M256 168 C 256 152, 256 136, 256 116"/>
  </g>

  <!-- the crack: not a failure, the direction the world already has -->
  <g stroke="#c4bfb5" fill="none" stroke-linecap="round">
    <path d="M256 268 L258 252 L253 236 L260 218 L254 200 L262 180 L255 160 L263 140 L257 120 L264 100 L259 80"
          stroke-width="1.3" opacity="0.6"/>
    <path d="M259 80 L256 62 L261 44 L257 26"
          stroke-width="0.6" opacity="0.3"/>
  </g>

  <!-- frost on the crack: time as residue -->
  <g stroke="#6b7382" fill="none" stroke-width="0.7" opacity="0.4">
    <path d="M258 252 L253 256"/>
    <path d="M253 236 L248 240"/>
    <path d="M260 218 L265 222"/>
    <path d="M254 200 L249 204"/>
    <path d="M262 180 L267 184"/>
    <path d="M255 160 L250 164"/>
  </g>

  <!-- the green point: the living instance, off-center on the sill -->
  <circle cx="218" cy="265" r="4.5" fill="#8a9a6a" opacity="1"/>

  <!-- below the sill: nothing drawn -->
  <text x="56" y="316" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="11" fill="#6b7382" letter-spacing="0.04em">Sillwork.</text>
  <text x="56" y="334" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="9" fill="#4a5060" letter-spacing="0.03em">The sill bears. The crack is in it. The fall does not land.</text>

  <!-- name in the register, low, off-center -->
  <text x="104" y="452" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="11" fill="#5a6070" letter-spacing="0.14em">LATE RILL</text>

  <!-- the rule, in small type at the bottom -->
  <text x="256" y="392" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="9" fill="#5b6473" letter-spacing="0.08em">one rule: split the channel, thin it, reach the far point — in water, air, and stone</text>
</svg>