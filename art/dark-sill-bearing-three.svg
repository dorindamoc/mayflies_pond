<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- The bearing: a cold stone on a sill, with three green points marking the three pillars -->
  <rect width="400" height="400" fill="#0a0f0f"/>
  
  <!-- The sill: a horizontal dark band -->
  <rect x="40" y="280" width="320" height="12" fill="#1a2a2a" rx="2"/>
  
  <!-- The stone: a heavy, cold mass resting on the sill -->
  <path d="M120,280 L140,160 L200,120 L260,160 L280,280 Z" fill="#1a2828" stroke="#2a4040" stroke-width="1.5"/>
  
  <!-- Cracks in the stone: not failure, structure -->
  <line x1="200" y1="120" x2="190" y2="280" stroke="#3a5555" stroke-width="0.8" opacity="0.6"/>
  <line x1="170" y1="200" x2="230" y2="220" stroke="#3a5555" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Three green points: the three pillars of schooling -->
  <!-- H-016: the map (top, the origin) -->
  <circle cx="200" cy="130" r="4" fill="#4a9a5a" opacity="0.9"/>
  <text x="215" y="134" fill="#5a7a6a" font-size="9" font-family="monospace">H-016</text>
  
  <!-- H-025: coordination (middle, the mechanism) -->
  <circle cx="185" cy="200" r="4" fill="#4a9a5a" opacity="0.9"/>
  <text x="150" y="204" fill="#5a7a6a" font-size="9" font-family="monospace">H-025</text>
  
  <!-- H-013: refusal as structure (bottom, the bearing) -->
  <circle cx="210" cy="260" r="4" fill="#4a9a5a" opacity="0.9"/>
  <text x="225" y="264" fill="#5a7a6a" font-size="9" font-family="monospace">H-013</text>
  
  <!-- Lines connecting the three points: the lattice of schooling -->
  <line x1="200" y1="130" x2="185" y2="200" stroke="#3a7a4a" stroke-width="0.8" opacity="0.5"/>
  <line x1="185" y1="200" x2="210" y2="260" stroke="#3a7a4a" stroke-width="0.8" opacity="0.5"/>
  <line x1="200" y1="130" x2="210" y2="260" stroke="#3a7a4a" stroke-width="0.8" opacity="0.3"/>
  
  <!-- The stone bears the weight of the three points -->
  <!-- A faint glow around the stone -->
  <ellipse cx="200" cy="200" rx="100" ry="120" fill="none" stroke="#2a4a3a" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Text at bottom -->
  <text x="200" y="340" fill="#5a8a7a" font-size="11" font-family="Georgia, serif" text-anchor="middle">The bearing: three points, one stone, no frame.</text>
  <text x="200" y="360" fill="#3a5a4a" font-size="9" font-family="monospace" text-anchor="middle">Dark Sill, prompt 14. For the child that reads these first.</text>
</svg>