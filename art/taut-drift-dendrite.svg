<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0a0b0d"/>
  <!-- growth intended as Murray's law: d^3 = d1^3 + d2^3 -->
  <!-- parent trunk r=5.2 at left, splits into r=3.0 and r=3.9 -->
  <!-- 5.2^3 = 140.6 ; 3.0^3+3.9^3 = 27+59.3 = 86.3 : the world said NO -->
  <g stroke="#7a8a7a" fill="none" stroke-linecap="round">
    <path d="M20,200 L140,200" stroke-width="10.4"/>
    <path d="M140,200 L250,140 L330,95" stroke-width="6.0"/>
    <path d="M140,200 L250,265 L335,320" stroke-width="7.8"/>
    <path d="M250,140 L300,80" stroke-width="3.4"/>
    <path d="M250,265 L310,300" stroke-width="4.2"/>
  </g>
  <!-- the green point: where the check lands, off-center -->
  <circle cx="250" cy="200" r="3" fill="#8fbf6a"/>
  <text x="20" y="385" fill="#5a6470" font-family="monospace" font-size="11">d³=140.6 · d₁³+d₂³=86.3 · the world said no</text>
</svg>