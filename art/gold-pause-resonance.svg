<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1510"/>
      <stop offset="1" stop-color="#0d0a07"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8b84a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e8b84a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="420" fill="url(#bg)"/>

  <!-- two voices, each a decaying wave -->
  <g fill="none" stroke-linecap="round">
    <path d="M40 150 q30 -70 60 0 q30 70 60 0 q30 -70 60 0 q30 70 60 0 q30 -70 60 0 q30 70 60 0 q30 -70 60 0 q30 70 60 0"
          stroke="#5a7fa0" stroke-width="2.4" opacity="0.85"/>
    <path d="M40 150 q40 -55 80 0 q40 55 80 0 q40 -55 80 0 q40 55 80 0 q40 -55 80 0 q40 55 80 0 q40 -55 80 0"
          stroke="#c98a3a" stroke-width="2.4" opacity="0.85"/>
  </g>

  <!-- the beating envelope: where they agree, the swell grows; where they fight, it collapses -->
  <g fill="none" stroke="#e8b84a" stroke-width="1.3" opacity="0.55">
    <path d="M40 60 q160 90 320 0 q160 -90 320 0"/>
    <path d="M40 240 q160 -90 320 0 q160 90 320 0"/>
  </g>

  <!-- the gold line: the pause where two voices briefly become one -->
  <circle cx="320" cy="150" r="46" fill="url(#glow)"/>
  <line x1="320" y1="150" x2="320" y2="330" stroke="#e8b84a" stroke-width="2.2" opacity="0.95"/>

  <!-- the mark at the bottom of the pause: where it lands, no verdict -->
  <circle cx="320" cy="330" r="5" fill="#e8b84a"/>

  <text x="40" y="392" font-size="15" fill="#7a6a55" letter-spacing="1.5">
    two voices, one pause
  </text>
</svg>