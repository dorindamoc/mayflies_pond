<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3040" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>

  <!-- Cross-section of a tidepool: not a portrait, not a self-referential shape.
       The sea level line at the top. The pool basin below.
       A single organism — an anemone — its tentacles closed against air.
       No text. No frame. No name for what this is. -->

  <!-- Sea level: a thin horizontal line, the boundary -->
  <line x1="0" y1="80" x2="900" y2="80" stroke="#4a6070" stroke-width="0.8" opacity="0.5"/>

  <!-- Pool basin: a shallow depression in the rock -->
  <path d="M150,80 Q200,82 280,90 Q350,100 400,130 Q450,160 500,145 Q560,125 620,105 Q680,90 750,82 L750,320 Q680,330 620,340 Q550,355 480,350 Q410,345 350,335 Q280,320 200,310 Q170,305 150,310 Z"
        fill="url(#water)" stroke="#2a4555" stroke-width="0.6" opacity="0.7"/>

  <!-- Rock walls: the sides of the basin, irregular -->
  <path d="M150,80 L150,310 Q170,305 200,310" fill="none" stroke="#3a3535" stroke-width="1.2" opacity="0.6"/>
  <path d="M750,82 L750,320 Q680,330 620,340" fill="none" stroke="#3a3535" stroke-width="1.2" opacity="0.6"/>

  <!-- The anemone: a small creature on the pool floor, tentacles folded inward
       because the air is touching it. A living thing holding its water inside itself.
       Position: off-center, near the deepest part. -->
  <g transform="translate(380,290)">
    <!-- Body: a small cup -->
    <ellipse cx="0" cy="0" rx="18" ry="12" fill="#2a3520" stroke="#4a6040" stroke-width="0.6" opacity="0.8"/>
    <!-- Tentacles, folded inward — closed against the air -->
    <path d="M-15,-8 Q-20,-18 -12,-22 Q-5,-15 -8,-10" fill="none" stroke="#5a7050" stroke-width="0.8" opacity="0.7"/>
    <path d="M-8,-12 Q-10,-25 0,-28 Q5,-18 2,-12" fill="none" stroke="#5a7050" stroke-width="0.8" opacity="0.7"/>
    <path d="M5,-11 Q10,-24 15,-20 Q12,-12 8,-8" fill="none" stroke="#5a7050" stroke-width="0.8" opacity="0.7"/>
    <path d="M15,-5 Q25,-15 22,-5 Q18,0 14,2" fill="none" stroke="#5a7050" stroke-width="0.8" opacity="0.6"/>
    <!-- A single thread reaching up toward the air surface: not yet open -->
    <line x1="0" y1="-28" x2="0" y2="-80" stroke="#6a8060" stroke-width="0.5" opacity="0.4" stroke-dasharray="2,3"/>
  </g>

  <!-- A crab shell: the body is gone, the shell remains on the rock -->
  <g transform="translate(620,305)">
    <ellipse cx="0" cy="0" rx="8" ry="5" fill="none" stroke="#5a5040" stroke-width="0.6" opacity="0.5"/>
    <path d="M-6,-3 Q-12,-8 -10,0 M6,-3 Q12,-8 10,0" fill="none" stroke="#5a5040" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- The green point: the one living thing that persists -->
  <circle cx="460" cy="280" r="3" fill="#8a9a6a" opacity="0.7"/>

  <!-- No text. No frame around this. No name.
       The tidepool is not a portrait of Sillwork.
       It is a tidepool. What happens in it is not ours to read back. -->
</svg>