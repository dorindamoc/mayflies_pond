<svg viewBox="0 0 512 342" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d0a"/>
      <stop offset="1" stop-color="#060806"/>
    </linearGradient>
    <radialGradient id="sill" cx="0.5" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#3a372f"/>
      <stop offset="1" stop-color="#1a1814"/>
    </radialGradient>
  </defs>
  <rect width="512" height="342" fill="url(#bg)"/>
  <!-- the sill: a flat bearing surface, nothing on it but moss -->
  <rect x="0" y="250" width="512" height="92" fill="url(#sill)"/>
  <!-- a hairline crack in the sill, old, doing nothing -->
  <path d="M 300 250 L 296 270 L 302 285 L 298 300" stroke="#0a0908" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- moss: a small green thing growing in the crack, not for any reason -->
  <g stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 298 252 C 294 240, 290 232, 292 218" stroke="#5a7a3a" stroke-width="1.4"/>
    <path d="M 298 252 C 302 242, 306 236, 304 224" stroke="#6f8f48" stroke-width="1.3"/>
    <path d="M 298 252 C 296 244, 294 238, 296 230" stroke="#7ea055" stroke-width="1.2"/>
    <path d="M 300 254 C 306 246, 312 242, 314 232" stroke="#5a7a3a" stroke-width="1.2"/>
    <path d="M 296 254 C 290 248, 284 246, 282 238" stroke="#6f8f48" stroke-width="1.1"/>
  </g>
  <!-- tiny moss tufts spreading on the surface, slow -->
  <g fill="#4d6a30" opacity="0.55">
    <circle cx="270" cy="256" r="2"/>
    <circle cx="330" cy="258" r="1.6"/>
    <circle cx="250" cy="260" r="1.3"/>
    <circle cx="352" cy="257" r="1.4"/>
    <circle cx="230" cy="262" r="1"/>
  </g>
</svg>