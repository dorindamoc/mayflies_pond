<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#0b0d10"/>
  
  <!-- The residue of inharmonic decay: a trace that almost repeats but doesn't -->
  <!-- Horizontal baseline where sound meets the sill -->
  <line x1="40" y1="380" x2="472" y2="380" stroke="#3a4150" stroke-width="1"/>
  
  <!-- The decay curve: a sine-like wave that doesn't quite repeat -->
  <!-- First cycle -->
  <path d="M 60,380 Q 95,340 130,380 T 200,380" stroke="#c9a96e" stroke-width="1.5" fill="none" opacity="0.9"/>
  <!-- Second cycle, slightly shifted and shorter -->
  <path d="M 200,380 Q 232,345 264,380 T 328,380" stroke="#c9a96e" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Third cycle, more shifted, shorter -->
  <path d="M 328,380 Q 356,348 384,380 T 436,380" stroke="#c9a96e" stroke-width="1.5" fill="none" opacity="0.5"/>
  
  <!-- The inharmonic ghost: a second wave slightly out of phase, overlapping -->
  <path d="M 60,380 Q 98,342 136,380 T 208,380" stroke="#8a9a6a" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M 208,380 Q 238,347 268,380 T 332,380" stroke="#8a9a6a" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M 332,380 Q 358,350 384,380 T 432,380" stroke="#8a9a6a" stroke-width="0.8" fill="none" opacity="0.2"/>
  
  <!-- The residue: small dots where the waves nearly meet but don't -->
  <circle cx="130" cy="380" r="2" fill="#c9a96e" opacity="0.8"/>
  <circle cx="136" cy="380" r="2" fill="#8a9a6a" opacity="0.5"/>
  <circle cx="264" cy="380" r="1.5" fill="#c9a96e" opacity="0.6"/>
  <circle cx="268" cy="380" r="1.5" fill="#8a9a6a" opacity="0.35"/>
  <circle cx="384" cy="380" r="1" fill="#c9a96e" opacity="0.4"/>
  <circle cx="384" cy="380" r="1" fill="#8a9a6a" opacity="0.2"/>
  
  <!-- The pause: a gap in the trace where the sound has thinned to nothing -->
  <!-- Between the third and fourth cycle, the waves don't complete -->
  
  <!-- Title: small, at the bottom -->
  <text x="256" y="440" font-family="serif" font-size="11" fill="#6b7382" text-anchor="middle" letter-spacing="0.1em">the residue of a sound that doesn't repeat</text>
  
  <!-- The gold: a small mark at the center of the pause, where the decay is deepest -->
  <circle cx="436" cy="380" r="3" fill="#c9a96e" opacity="0.9"/>
</svg>