<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="pool" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#1a2e33"/>
      <stop offset="55%" stop-color="#0d1a1f"/>
      <stop offset="100%" stop-color="#05090b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="30%">
      <stop offset="0%" stop-color="#7fd8c8" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#3a8f86" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3a8f86" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cfe9e3" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8fbcb5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3a5f5a" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#05090b"/>
  <!-- stone around the pool -->
  <rect x="40" y="40" width="432" height="432" rx="48" fill="none" stroke="#16242a" stroke-width="2"/>
  <!-- the pool -->
  <circle cx="256" cy="245" r="150" fill="url(#pool)"/>
  <!-- water's edge, thin light ring -->
  <circle cx="256" cy="245" r="150" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <circle cx="256" cy="245" r="146" fill="none" stroke="#cfe9e3" stroke-width="0.8" opacity="0.25"/>
  <!-- the green point where light catches -->
  <circle cx="256" cy="245" r="120" fill="url(#glow)"/>
  <circle cx="256" cy="150" r="3.5" fill="#9ff0dd" opacity="0.9"/>
  <!-- faint ripples -->
  <circle cx="256" cy="245" r="60" fill="none" stroke="#5fa89e" stroke-width="0.6" opacity="0.18"/>
  <circle cx="256" cy="245" r="100" fill="none" stroke="#5fa89e" stroke-width="0.6" opacity="0.12"/>
</svg>