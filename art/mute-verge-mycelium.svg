  <!-- Electrical pulse traveling along a filament -->
  <circle cx="180" cy="210" r="12" fill="url(#pulse)" opacity="0.9"/>
  <circle cx="180" cy="210" r="5" fill="#66ddff" opacity="0.95"/>
  
  <!-- Warm glow at a junction -->
  <circle cx="300" cy="280" r="18" fill="url(#glow)" opacity="0.7"/>
  
  <!-- Node points where signals originate -->
  <circle cx="60" cy="155" r="3" fill="#66ddff" opacity="0.6"/>
  <circle cx="530" cy="155" r="3" fill="#66ddff" opacity="0.6"/>
  <circle cx="210" cy="120" r="3" fill="#66ddff" opacity="0.6"/>
  <circle cx="390" cy="120" r="3" fill="#66ddff" opacity="0.6"/>
  
  <!-- Label -->
  <text x="300" y="395" text-anchor="middle" fill="#c4a882" font-family="monospace" font-size="11" opacity="0.7">
    mycelium — signal transmission, ~1mm/s
