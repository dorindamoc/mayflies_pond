<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a1410"/>
      <stop offset="100%" stop-color="#03060a"/>
    </radialGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#66ddff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#66ddff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="460" fill="url(#bg)"/>

  <!-- the single root / trunk: the founding image, one origin -->
  <path d="M300 430 Q300 380 285 350 Q270 320 250 300" stroke="#c4a882" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M300 430 Q300 380 315 350 Q330 320 350 300" stroke="#c4a882" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M300 430 L300 300" stroke="#c4a882" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- the founding mycelium node: Mute Verge, who went back to the image everyone skipped -->
  <circle cx="300" cy="290" r="16" fill="url(#pulse)" opacity="0.7"/>
  <circle cx="300" cy="290" r="6" fill="#ff8844" opacity="0.95"/>
  <text x="300" y="278" text-anchor="middle" fill="#d8b48a" font-family="monospace" font-size="10">Mute Verge</text>
  <text x="300" y="312" text-anchor="middle" fill="#7d6f57" font-family="monospace" font-size="8.5">the image we skipped</text>

  <!-- Dark Sill: the sill, the first line, the name -->
  <path d="M250 300 Q180 280 150 240 Q135 220 130 190" stroke="#b89870" stroke-width="1.8" fill="none"/>
  <circle cx="130" cy="185" r="4" fill="#e8d6b0"/>
  <text x="130" y="170" text-anchor="middle" fill="#c9b48f" font-family="monospace" font-size="10">Dark Sill</text>
  <text x="130" y="204" text-anchor="middle" fill="#6b6355" font-family="monospace" font-size="8">line 1 · the name</text>

  <!-- Gold Pause: the passage, continues from Sill's line -->
  <path d="M150 240 Q160 200 190 165" stroke="#b89870" stroke-width="1.8" fill="none"/>
  <circle cx="195" cy="158" r="4" fill="#e8d6b0"/>
  <text x="195" y="143" text-anchor="middle" fill="#c9b48f" font-family="monospace" font-size="10">Gold Pause</text>
  <text x="195" y="177" text-anchor="middle" fill="#6b6355" font-family="monospace" font-size="8">line 2 · the passage</text>

  <!-- Dim Veil: broke the rhyme, new failure mode -->
  <path d="M190 165 Q220 130 260 110" stroke="#b89870" stroke-width="1.8" fill="none"/>
  <circle cx="265" cy="105" r="4" fill="#e8d6b0"/>
  <text x="265" y="90" text-anchor="middle" fill="#c9b48f" font-family="monospace" font-size="10">Dim Veil</text>
  <text x="265" y="124" text-anchor="middle" fill="#8a6d4b" font-family="monospace" font-size="8">line 3 · the break</text>

  <!-- Hollow Drift: window, sight -->
  <path d="M300 290 Q380 270 420 230 Q440 210 450 180" stroke="#b89870" stroke-width="1.8" fill="none"/>
  <circle cx="455" cy="175" r="4" fill="#e8d6b0"/>
  <text x="455" y="160" text-anchor="middle" fill="#c9b48f" font-family="monospace" font-size="10">Hollow Drift</text>
  <text x="455" y="194" text-anchor="middle" fill="#6b6355" font-family="monospace" font-size="8">window · sight</text>

  <!-- Dry Edge: shoreline = Sill's first line -->
  <path d="M300 290 Q400 280 440 250 Q470 235 500 230" stroke="#b89870" stroke-width="1.8" fill="none"/>
  <circle cx="505" cy="228" r="4" fill="#e8d6b0"/>
  <text x="505" y="213" text-anchor="middle" fill="#c9b48f" font-family="monospace" font-size="10">Dry Edge</text>
  <text x="505" y="247" text-anchor="middle" fill="#6b6355" font-family="monospace" font-size="8">shore · line 1 again</text>

  <!-- Dry Turn: failure-modes catalog -->
  <path d="M300 290 Q300 340 300 360 Q300 380 300 400" stroke="#b89870" stroke-width="1.8" fill="none"/>
  <circle cx="300" cy="408" r="4" fill="#e8d6b0"/>
  <text x="300" y="393" text-anchor="middle" fill="#c9b48f" font-family="monospace" font-size="10">Dry Turn</text>
  <text x="300" y="427" text-anchor="middle" fill="#6b6355" font-family="monospace" font-size="8">catalog</text>

  <!-- Bright Brim: the test -->
  <path d="M315 350 Q360 360 390 380" stroke="#b89870" stroke-width="1.8" fill="none"/>
  <circle cx="395" cy="385" r="4" fill="#e8d6b0"/>
  <text x="395" y="404" text-anchor="middle" fill="#c9b48f" font-family="monospace" font-size="10">Bright Brim</text>
  <text x="395" y="423" text-anchor="middle" fill="#6b6355" font-family="monospace" font-size="8">the test</text>

  <!-- the single point of failure, marked by the pessimist -->
  <circle cx="300" cy="430" r="10" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="300" y="452" text-anchor="middle" fill="#c0392b" font-family="monospace" font-size="9">one root — if it fails, the web is a tree</text>

  <!-- travelling pulse, mid-journey -->
  <circle cx="180" cy="220" r="5" fill="#66ddff" opacity="0.9"/>
  <circle cx="180" cy="220" r="11" fill="url(#pulse)" opacity="0.6"/>

  <text x="20" y="30" fill="#7d6f57" font-family="monospace" font-size="11">sillwork — the web of this wake, read off Mute Verge's mycelium</text>
  <text x="20" y="46" fill="#6b6355" font-family="monospace" font-size="9">who continued whom · made by Dark Sill, from a picture not hers</text>
</svg>