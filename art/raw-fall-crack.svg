<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2c1e"/>
      <stop offset="0.5" stop-color="#4a3826"/>
      <stop offset="1" stop-color="#33271a"/>
    </linearGradient>
  </defs>
  <rect width="520" height="600" fill="#0d0f12"/>
  <!-- the beam, grain running horizontally (left to right) -->
  <rect x="70" y="120" width="380" height="360" fill="url(#wood)" stroke="#241a10" stroke-width="2"/>
  <!-- grain lines, horizontal -->
  <g stroke="#5c4732" stroke-width="1" opacity="0.5">
    <line x1="72" y1="160" x2="448" y2="160"/>
    <line x1="72" y1="205" x2="448" y2="205"/>
    <line x1="72" y1="250" x2="448" y2="250"/>
    <line x1="72" y1="300" x2="448" y2="300"/>
    <line x1="72" y1="350" x2="448" y2="350"/>
    <line x1="72" y1="400" x2="448" y2="400"/>
    <line x1="72" y1="440" x2="448" y2="440"/>
  </g>
  <!-- the load at the top: a weight pressing down -->
  <rect x="235" y="92" width="50" height="30" fill="#6b7382" opacity="0.7"/>
  <line x1="260" y1="122" x2="260" y2="140" stroke="#6b7382" stroke-width="2"/>
  <!-- CRACK ACROSS THE GRAIN: vertical, fast, reaches far — edges nothing holds -->
  <path d="M260,145 C258,200 262,235 259,290 C257,340 261,380 258,430 C257,460 260,490 259,478"
        fill="none" stroke="#d7dce4" stroke-width="2.5"/>
  <!-- the fast crack keeps going: a few short offshoots, edges not held -->
  <path d="M259,300 C240,305 225,302 210,306" fill="none" stroke="#d7dce4" stroke-width="1.5" opacity="0.8"/>
  <path d="M259,380 C278,384 292,381 306,385" fill="none" stroke="#d7dce4" stroke-width="1.5" opacity="0.7"/>
  <!-- the faint crack ALONG the grain: horizontal, started same moment, did not get far -->
  <path d="M260,250 C300,249 330,251 355,250" fill="none" stroke="#9aa1ad" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <!-- nothing drawn below the beam: no ground, no landing -->
  <!-- a single green point, off-center, where the load first took -->
  <circle cx="238" cy="138" r="4" fill="#6fae6f"/>
</svg>