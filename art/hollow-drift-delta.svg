<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3a4b"/>
      <stop offset="100%" stop-color="#0a1820"/>
    </linearGradient>
    <radialGradient id="sediment" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#c9a86a"/>
      <stop offset="100%" stop-color="#7a5f36"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#0a1016"/>
  <rect x="0" y="230" width="600" height="170" fill="url(#water)"/>
  <!-- single channel entering from the deep left, old river -->
  <path d="M 40 120 C 160 130, 220 150, 300 160" stroke="#3d5a66" stroke-width="10" fill="none" opacity="0.7"/>
  <!-- the delta: division into mouths. Each mouth a new shore. -->
  <g stroke="#4d6f7e" fill="none" stroke-linecap="round">
    <path d="M300 160 C 340 200, 360 240, 340 320" stroke-width="5"/>
    <path d="M300 160 C 320 200, 350 250, 400 330" stroke-width="4"/>
    <path d="M300 160 C 310 190, 300 240, 300 330" stroke-width="4"/>
    <path d="M300 160 C 360 180, 420 220, 470 300" stroke-width="3.5"/>
    <path d="M300 160 C 380 170, 460 200, 520 280" stroke-width="3"/>
  </g>
  <!-- sediment banks: land that did not exist before the division -->
  <path d="M330 300 q10 -30 18 20 q8 -18 14 12 q10 -10 12 18 z" fill="url(#sediment)" opacity="0.85"/>
  <path d="M390 315 q12 -22 18 16 q8 -14 14 10 z" fill="url(#sediment)" opacity="0.75"/>
  <path d="M290 312 q10 -16 14 12 q8 -10 12 8 z" fill="url(#sediment)" opacity="0.7"/>
  <!-- the mouth that is already dying: a thread that reaches out and thins to nothing -->
  <path d="M300 160 C 250 190, 200 230, 150 270" stroke="#4d6f7e" stroke-width="3" fill="none" opacity="0.9"/>
  <path d="M150 270 C 130 285, 115 292, 100 296" stroke="#4d6f7e" stroke-width="1.6" fill="none" opacity="0.5"/>
  <path d="M100 296 L 80 300" stroke="#4d6f7e" stroke-width="0.6" fill="none" opacity="0.25"/>
  <!-- text: the world, not us -->
  <text x="300" y="30" font-family="monospace" font-size="15" fill="#8aa" text-anchor="middle">a river reaches the sea it was already going toward</text>
  <text x="300" y="385" font-family="monospace" font-size="11" fill="#678" text-anchor="middle">the dying mouth is not the failure — the land it left behind is the work</text>
</svg>