<svg viewBox="0 0 512 410" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="410" fill="#0a0e14"/>
  
  <!-- Left transient: damped pendulum settling toward dashed law -->
  <g stroke="#4a6a7a" fill="none" stroke-width="1.2">
    <path d="M 60 80 Q 120 180 80 260" opacity="0.9"/>
    <path d="M 80 100 Q 130 190 100 265" opacity="0.7"/>
    <path d="M 100 120 Q 140 200 120 268" opacity="0.5"/>
    <path d="M 120 140 Q 150 210 135 270" opacity="0.35"/>
    <path d="M 135 160 Q 155 220 145 272" opacity="0.2"/>
  </g>
  
  <!-- Dashed steady-state law for left -->
  <line x1="50" y1="280" x2="160" y2="280" stroke="#5a8a9a" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <text x="55" y="300" fill="#5a8a9a" font-size="9" font-family="monospace" opacity="0.7">law (damped)</text>
  
  <!-- Right transient: damped pendulum into absence -->
  <g stroke="#7a5a6a" fill="none" stroke-width="1.2">
    <path d="M 350 80 Q 410 180 370 260" opacity="0.9"/>
    <path d="M 370 100 Q 420 190 390 265" opacity="0.7"/>
    <path d="M 390 120 Q 430 200 405 268" opacity="0.5"/>
    <path d="M 405 140 Q 435 210 415 270" opacity="0.35"/>
    <path d="M 415 160 Q 440 220 425 272" opacity="0.15"/>
  </g>
  
  <!-- No dashed line for right — just absence -->
  <text x="355" y="300" fill="#7a5a6a" font-size="9" font-family="monospace" opacity="0.5">no law (end of record)</text>
  
  <!-- The handoff: a single point where left's last swing meets right's first swing -->
  <circle cx="256" cy="170" r="4" fill="#c8b87a" opacity="0.9"/>
  <circle cx="256" cy="170" r="12" fill="none" stroke="#c8b87a" stroke-width="0.5" opacity="0.4"/>
  <circle cx="256" cy="170" r="24" fill="none" stroke="#c8b87a" stroke-width="0.3" opacity="0.2"/>
  
  <!-- Connecting arc: the shape that passes -->
  <path d="M 145 272 Q 200 240 256 170" fill="none" stroke="#8a9a7a" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,3"/>
  <path d="M 256 170 Q 310 240 425 272" fill="none" stroke="#8a9a7a" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,3"/>
  
  <!-- Label -->
  <text x="256" y="145" fill="#c8b87a" font-size="10" font-family="monospace" text-anchor="middle" opacity="0.8">handoff</text>
  <text x="256" y="340" fill="#6a7a8a" font-size="9" font-family="monospace" text-anchor="middle" opacity="0.6">the shape passes at the point where one record ends and the next begins</text>
  <text x="256" y="358" fill="#6a7a8a" font-size="8" font-family="monospace" text-anchor="middle" opacity="0.4">not a law. not an absence. the transfer itself.</text>
</svg>