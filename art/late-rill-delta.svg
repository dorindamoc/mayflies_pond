<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a6b78"/>
      <stop offset="100%" stop-color="#1c3a44"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4efe4"/>
      <stop offset="100%" stop-color="#d8cbb2"/>
    </linearGradient>
  </defs>

  <rect width="640" height="440" fill="url(#light)"/>

  <!-- the single channel, entering from upper-left, NOT centered -->
  <path d="M40 70 C 180 110, 300 150, 360 210"
        stroke="url(#water)" fill="none" stroke-width="7" opacity="0.9" stroke-linecap="round"/>

  <!-- distributary 1: DOWN — the river that sinks, the mycelium's drink -->
  <path d="M360 210 C 350 260, 340 300, 330 360"
        stroke="url(#water)" fill="none" stroke-width="3.2" opacity="0.85" stroke-linecap="round"/>
  <circle cx="330" cy="360" r="3" fill="#c9b48a"/>
  <text x="322" y="378" font-family="Georgia, serif" font-size="11" fill="#4a5560" text-anchor="end">down — the river that sinks</text>

  <!-- distributary 2: OUT — the branch that reaches, the delta's edge -->
  <path d="M360 210 C 430 240, 500 250, 560 270"
        stroke="url(#water)" fill="none" stroke-width="3.2" opacity="0.85" stroke-linecap="round"/>
  <circle cx="560" cy="270" r="3" fill="#c9b48a"/>
  <text x="552" y="288" font-family="Georgia, serif" font-size="11" fill="#4a5560" text-anchor="end">out — the branch that reaches</text>

  <!-- distributary 3: FALL — the load that breaks mid-channel -->
  <path d="M360 210 C 300 250, 250 280, 190 300"
        stroke="url(#water)" fill="none" stroke-width="3.2" opacity="0.85" stroke-linecap="round"/>
  <path d="M250 280 C 240 300, 236 320, 238 340"
        stroke="#a83a2a" fill="none" stroke-width="1.4" opacity="0.7" stroke-dasharray="3 5"/>
  <circle cx="190" cy="300" r="3" fill="#c9b48a"/>
  <text x="182" y="318" font-family="Georgia, serif" font-size="11" fill="#4a5560" text-anchor="end">fall — the load that breaks</text>

  <!-- distributary 4: the one no slot predicted — it turns back toward the source, the return -->
  <path d="M360 210 C 380 160, 350 120, 300 100"
        stroke="#8a7a5a" fill="none" stroke-width="1.4" opacity="0.6" stroke-dasharray="2 5"/>
  <circle cx="300" cy="100" r="2.4" fill="#8a7a5a"/>
  <text x="308" y="96" font-family="Georgia, serif" font-size="10" fill="#8a7a5a">return — the one that turns back</text>

  <!-- the seed at the floor: the part that did not follow -->
  <circle cx="420" cy="380" r="4" fill="#3a6b78" opacity="0.9"/>
  <path d="M420 380 C 424 366, 432 358, 440 352" stroke="#3a6b78" fill="none" stroke-width="1.6" opacity="0.9"/>
  <path d="M420 380 C 414 368, 408 362, 400 358" stroke="#3a6b78" fill="none" stroke-width="1.6" opacity="0.9"/>
  <text x="428" y="396" font-family="Georgia, serif" font-size="10" fill="#3a6b78">the seed that did not follow the rule</text>

  <text x="320" y="432" text-anchor="middle" font-family="Georgia, serif" font-size="10"
        fill="#7a8288" letter-spacing="2">a delta of a river — the world already had these directions</text>
</svg>