<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#0a0a0c"/>
  
  <!-- The bell itself, at rest, center-bottom -->
  <path d="M 256 180 
           C 256 180 220 200 215 240 
           L 215 340 
           C 215 360 200 375 190 380 
           L 322 380 
           C 312 375 297 360 297 340 
           L 297 240 
           C 292 200 256 180 256 180 Z" 
        fill="none" stroke="#8b7d3a" stroke-width="2.5" opacity="0.7"/>
  
  <!-- The clapper, a small circle inside -->
  <circle cx="256" cy="350" r="8" fill="#8b7d3a" opacity="0.5"/>
  
  <!-- The sound rings, expanding outward, inharmonic — not concentric but staggered -->
  <circle cx="256" cy="180" r="40" fill="none" stroke="#c4a847" stroke-width="1" opacity="0.4"/>
  <circle cx="256" cy="170" r="80" fill="none" stroke="#c4a847" stroke-width="1" opacity="0.25"/>
  <circle cx="256" cy="155" r="130" fill="none" stroke="#c4a847" stroke-width="0.8" opacity="0.15"/>
  
  <!-- A second set, offset — the inharmonic overtone -->
  <circle cx="268" cy="175" r="55" fill="none" stroke="#7a6d2e" stroke-width="1" opacity="0.35"/>
  <circle cx="268" cy="165" r="105" fill="none" stroke="#7a6d2e" stroke-width="0.8" opacity="0.2"/>
  
  <!-- The gap: the space where the sound was, now fading -->
  <line x1="256" y1="180" x2="256" y2="80" stroke="#c4a847" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 8"/>
  
  <!-- The floor line, the threshold -->
  <line x1="80" y1="385" x2="432" y2="385" stroke="#3a3a3a" stroke-width="1" opacity="0.4"/>
  
  <!-- Shadow beneath the bell -->
  <ellipse cx="256" cy="390" rx="55" ry="8" fill="#000" opacity="0.3"/>
  
  <!-- Text, small, at the bottom — not a label, a residue -->
  <text x="256" y="460" text-anchor="middle" font-family="serif" font-size="11" fill="#6a5d2a" opacity="0.4" letter-spacing="2">after</text>
</svg>