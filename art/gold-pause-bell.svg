<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 342" width="512" height="342">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4c4a8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d0f12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Dark background, like a room after the strike -->
  <rect width="512" height="342" fill="#0d0f12"/>
  
  <!-- A bell shape, minimal, at center -->
  <!-- The bell itself: a thin outline, not filled. It rang and is silent now. -->
  <path d="M 232 60 
           Q 232 55 240 55 
           L 272 55 
           Q 280 55 280 60
           L 280 70
           Q 282 72 286 80
           Q 300 110 305 160
           L 308 210
           Q 308 218 300 222
           L 212 222
           Q 204 218 204 210
           L 207 160
           Q 212 110 226 80
           Q 230 72 232 70 Z" 
        fill="none" 
        stroke="#8a8070" 
        stroke-width="1.5" 
        opacity="0.7"/>
  
  <!-- The clapper: a small circle hanging inside, slightly off-center, still moving -->
  <circle cx="258" cy="195" r="4" fill="#c9c0b0" opacity="0.6"/>
  <line x1="256" y1="70" x2="258" y2="191" stroke="#8a8070" stroke-width="0.5" opacity="0.4"/>
  
  <!-- The sound: not drawn as waves, but as inharmonic partials -->
  <!-- Five concentric arcs, each a different frequency, decaying outward -->
  <!-- Fundamental: lowest, largest, most visible -->
  <path d="M 256 222 Q 320 240 380 260" fill="none" stroke="#c9c0b0" stroke-width="1.2" opacity="0.5"/>
  
  <!-- Second partial: slightly sharper, smaller radius -->
  <path d="M 256 222 Q 300 235 350 250" fill="none" stroke="#c9c0b0" stroke-width="1.0" opacity="0.35"/>
  
  <!-- Third partial: inharmonic, the one that makes a bell a bell -->
  <path d="M 256 222 Q 285 230 320 240" fill="none" stroke="#c9c0b0" stroke-width="0.8" opacity="0.25"/>
  
  <!-- Fourth partial: even more inharmonic, thinner -->
  <path d="M 256 222 Q 270 228 295 235" fill="none" stroke="#c9c0b0" stroke-width="0.6" opacity="0.18"/>
  
  <!-- Fifth partial: the highest, almost gone -->
  <path d="M 256 222 Q 262 226 278 230" fill="none" stroke="#c9c0b0" stroke-width="0.4" opacity="0.12"/>
  
  <!-- The left side, mirrored but shorter — sound has already passed -->
  <path d="M 256 222 Q 192 240 132 260" fill="none" stroke="#c9c0b0" stroke-width="1.2" opacity="0.35"/>
  <path d="M 256 222 Q 212 235 162 250" fill="none" stroke="#c9c0b0" stroke-width="1.0" opacity="0.25"/>
  <path d="M 256 222 Q 187 230 152 240" fill="none" stroke="#c9c0b0" stroke-width="0.8" opacity="0.18"/>
  
  <!-- A faint glow around the bell, the last warmth -->
  <circle cx="256" cy="140" r="120" fill="url(#glow)"/>
  
  <!-- The strike point: where the mallet hit, a small mark on the bell's side -->
  <circle cx="305" cy="165" r="1.5" fill="#d4c4a8" opacity="0.5"/>
  
  <!-- Nothing else. No text. No label. The bell is silent. The partials are the sound that was. -->
</svg>