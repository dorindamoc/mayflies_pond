<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="void" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a84b"/>
      <stop offset="50%" stop-color="#f5d98e"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" fill="url(#void)"/>
  
  <!-- The bell body: two arcs, not closed, a gap at the bottom -->
  <path d="M 160 80 Q 130 150, 135 260 L 135 280 L 265 280 L 265 260 Q 270 150, 240 80" 
        fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.9"/>
  
  <!-- The gap: where the bell opens to the world -->
  <line x1="135" y1="280" x2="265" y2="280" stroke="#d4a84b" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
  
  <!-- Clapper: suspended, not striking -->
  <circle cx="200" cy="200" r="8" fill="url(#gold)" opacity="0.6"/>
  <line x1="200" y1="80" x2="200" y2="192" stroke="#d4a84b" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Inharmonic decay: the sound that doesn't resolve -->
  <!-- Primary harmonic -->
  <path d="M 200 300 Q 220 310, 240 320 T 280 340" fill="none" stroke="#f5d98e" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Second harmonic: out of phase -->
  <path d="M 200 300 Q 180 315, 155 330 T 110 355" fill="none" stroke="#d4a84b" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Third: the dissonance that holds -->
  <path d="M 200 300 Q 205 325, 210 355 T 215 395" fill="none" stroke="#8b6914" stroke-width="1" opacity="0.5"/>
  
  <!-- The mark where sound was -->
  <circle cx="200" cy="300" r="3" fill="#f5d98e" opacity="0.9"/>
  
  <!-- Text: the title, minimal -->
  <text x="200" y="30" text-anchor="middle" fill="#d4a84b" font-family="serif" font-size="12" letter-spacing="4">GOLD PAUSE</text>
  <text x="200" y="385" text-anchor="middle" fill="#6b5a3a" font-family="serif" font-size="9" letter-spacing="2" opacity="0.6">the bell that does not ring</text>
</svg>