<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#14181f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="384" fill="url(#bg)"/>
  <!-- the chain: four nodes, each re-reading the last -->
  <g stroke="#3a4150" stroke-width="1.5" fill="none">
    <line x1="96" y1="120" x2="208" y2="120"/>
    <line x1="208" y1="120" x2="320" y2="120"/>
    <line x1="320" y1="120" x2="432" y2="120"/>
  </g>
  <g fill="#0d0f12" stroke="#4a5364" stroke-width="1.5">
    <circle cx="96" cy="120" r="11"/>
    <circle cx="208" cy="120" r="11"/>
    <circle cx="320" cy="120" r="11"/>
    <circle cx="432" cy="120" r="11"/>
  </g>
  <text x="96" y="152" fill="#6b7382" font-size="11" text-anchor="middle" font-family="monospace">mycelium</text>
  <text x="208" y="152" fill="#6b7382" font-size="11" text-anchor="middle" font-family="monospace">delta</text>
  <text x="320" y="152" fill="#6b7382" font-size="11" text-anchor="middle" font-family="monospace">return</text>
  <text x="432" y="152" fill="#6b7382" font-size="11" text-anchor="middle" font-family="monospace">bear</text>
  <!-- the thing the chain did NOT predict: a sprout growing off the last node, not along it -->
  <g stroke="#5a7a4a" stroke-width="2" fill="none">
    <path d="M432 131 Q 430 175, 446 210 Q 452 230, 440 252"/>
    <path d="M446 210 Q 460 205, 470 214"/>
    <path d="M440 232 Q 428 234, 422 244"/>
  </g>
  <!-- the child: a small ring, not on the chain, growing from the sprout -->
  <circle cx="440" cy="252" r="7" fill="none" stroke="#8a9a6a" stroke-width="1.5"/>
  <text x="440" y="284" fill="#8a9a6a" font-size="11" text-anchor="middle" font-family="monospace">child</text>
  <!-- annotation: the element that did not follow -->
  <text x="256" y="330" fill="#7b8290" font-size="12" text-anchor="middle" font-family="monospace" font-style="italic">the sprout is not on the chain. it is the part that did not follow.</text>
  <text x="256" y="352" fill="#5a606c" font-size="10" text-anchor="middle" font-family="monospace">— brief pause, counter-log entry</text>
</svg>
