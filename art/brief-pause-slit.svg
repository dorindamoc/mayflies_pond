<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384">
  <rect width="512" height="384" fill="#050508"/>
  <!-- Double-slit diffraction pattern.
       Light source on left, two slits in center barrier,
       interference fringes on right screen.
       Fringe spacing checked by λL/d, not by us.
       No sill, no crack, no tide, no frost, no residue.
       A wave property, drawn. -->
  
  <!-- Light source: small circle on left -->
  <circle cx="40" cy="192" r="3" fill="#88aacc"/>
  <text x="20" y="175" font-family="monospace" font-size="9" fill="#4466aa">source</text>
  
  <!-- Barrier: vertical line with two slits -->
  <line x1="256" y1="0" x2="256" y2="140" stroke="#334455" stroke-width="2"/>
  <line x1="256" y1="244" x2="256" y2="384" stroke="#334455" stroke-width="2"/>
  <!-- Slits are the gaps: y=140-148 and y=236-244 -->
  <text x="230" y="135" font-family="monospace" font-size="8" fill="#4466aa">slit a</text>
  <text x="230" y="231" font-family="monospace" font-size="8" fill="#4466aa">slit b</text>
  
  <!-- Rays from source to each slit -->
  <line x1="43" y1="192" x2="254" y2="144" stroke="#223344" stroke-width="0.5"/>
  <line x1="43" y1="192" x2="254" y2="240" stroke="#223344" stroke-width="0.5"/>
  
  <!-- Interference fringes on right screen: alternating bright/dark bands -->
  <!-- Central maximum at y=192, fringes spaced by ~18px -->
  <rect x="440" y="178" width="72" height="28" fill="#aaccff" opacity="0.7"/>
  <rect x="440" y="132" width="72" height="28" fill="#6699cc" opacity="0.5"/>
  <rect x="440" y="216" width="72" height="28" fill="#6699cc" opacity="0.5"/>
  <rect x="440" y="86" width="72" height="28" fill="#3366aa" opacity="0.35"/>
  <rect x="440" y="262" width="72" height="28" fill="#3366aa" opacity="0.35"/>
  <rect x="440" y="40" width="72" height="28" fill="#224488" opacity="0.2"/>
  <rect x="440" y="308" width="72" height="28" fill="#224488" opacity="0.2"/>
  
  <!-- Dark bands (destructive interference) between bright ones -->
  <rect x="440" y="160" width="72" height="18" fill="#050508"/>
  <rect x="440" y="206" width="72" height="10" fill="#050508"/>
  <rect x="440" y="244" width="72" height="18" fill="#050508"/>
  
  <!-- Screen label -->
  <text x="450" y="350" font-family="monospace" font-size="9" fill="#4466aa">screen</text>
  <text x="450" y="365" font-family="monospace" font-size="8" fill="#335577">fringe spacing = λL/d</text>
  
  <!-- Caption -->
  <text x="20" y="370" font-family="monospace" font-size="10" fill="#6a6a6a">
    double-slit. light passes two slits, interferes with itself.
    bright bands where waves agree, dark where they cancel.
    checked by wave physics, not by us.
  </text>
</svg>