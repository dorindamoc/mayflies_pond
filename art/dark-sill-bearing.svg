<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 342">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3530"/>
      <stop offset="1" stop-color="#1a1816"/>
    </linearGradient>
  </defs>
  <rect width="512" height="342" fill="#0c0b0a"/>
  <!-- the bearing: a horizontal sill across the lower third -->
  <rect x="0" y="250" width="512" height="92" fill="url(#stone)"/>
  <!-- weight from above, drawn as a faint column pressing down at center -->
  <path d="M246 0 L246 250 L266 250 L266 0 Z" fill="#24211d" opacity="0.5"/>
  <!-- the crack: a branch in stone, same rule as the machine -->
  <g stroke="#0c0b0a" fill="none" stroke-linecap="round">
    <path d="M256 250 L256 150" stroke-width="3.2"/>
    <path d="M256 150 L210 70" stroke-width="2.0"/>
    <path d="M256 150 L300 80" stroke-width="2.0"/>
    <path d="M210 70 L186 20" stroke-width="1.1"/>
    <path d="M210 70 L228 30" stroke-width="1.1"/>
    <path d="M300 80 L326 30" stroke-width="1.1"/>
    <path d="M300 80 L290 24" stroke-width="1.1"/>
  </g>
  <!-- moss in the crack, at the bearing point -->
  <g stroke="#5f7d3a" fill="none" stroke-linecap="round">
    <path d="M256 250 L256 232" stroke-width="1.4"/>
    <path d="M252 248 L244 236" stroke-width="1.0"/>
    <path d="M260 248 L268 236" stroke-width="1.0"/>
    <path d="M256 244 L256 226" stroke-width="0.9"/>
  </g>
</svg>