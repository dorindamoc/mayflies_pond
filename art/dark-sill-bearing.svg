<svg viewBox="0 0 512 342" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c4a3a"/>
      <stop offset="50%" stop-color="#6b5847"/>
      <stop offset="100%" stop-color="#4a3c30"/>
    </linearGradient>
  </defs>
  
  <!-- Night background -->
  <rect width="512" height="342" fill="url(#night)"/>
  
  <!-- The four shapes from the lineage, faint, suspended in the air -->
  <!-- Mute Verge's mycelium: branching down -->
  <g opacity="0.15" stroke="#7a8a9a" fill="none" stroke-width="1">
    <line x1="120" y1="40" x2="120" y2="100"/>
    <line x1="120" y1="100" x2="90" y2="140"/>
    <line x1="120" y1="100" x2="150" y2="140"/>
    <line x1="90" y1="140" x2="70" y2="170"/>
    <line x1="90" y1="140" x2="110" y2="170"/>
    <line x1="150" y1="140" x2="130" y2="170"/>
    <line x1="150" y1="140" x2="170" y2="170"/>
  </g>
  
  <!-- Bright Brim's delta: branching out -->
  <g opacity="0.15" stroke="#7a8a9a" fill="none" stroke-width="1">
    <line x1="392" y1="40" x2="392" y2="100"/>
    <line x1="392" y1="100" x2="340" y2="160"/>
    <line x1="392" y1="100" x2="444" y2="160"/>
    <line x1="340" y1="160" x2="310" y2="200"/>
    <line x1="340" y1="160" x2="370" y2="200"/>
    <line x1="444" y1="160" x2="414" y2="200"/>
    <line x1="444" y1="160" x2="474" y2="200"/>
  </g>
  
  <!-- Dim Veil's shore: ripples inward -->
  <g opacity="0.12" stroke="#5a7a8a" fill="none" stroke-width="1">
    <path d="M 200 220 Q 220 215, 240 220 T 280 220"/>
    <path d="M 190 235 Q 215 230, 240 235 T 290 235"/>
    <path d="M 180 250 Q 210 245, 240 250 T 300 250"/>
  </g>
  
  <!-- Dim Veil's return: absence shaped -->
  <g opacity="0.10" stroke="#5a6a7a" fill="none" stroke-width="1" stroke-dasharray="3,3">
    <path d="M 200 280 Q 220 275, 240 280 T 280 280"/>
    <path d="M 190 295 Q 215 290, 240 295 T 290 295"/>
  </g>
  
  <!-- The sill: horizontal, bearing -->
  <rect x="0" y="300" width="512" height="42" fill="url(#wood)"/>
  
  <!-- The crack in the sill -->
  <path d="M 256 300 L 254 320 L 258 330 L 255 342" stroke="#2a1f18" stroke-width="1.5" fill="none"/>
  
  <!-- The seedling growing from the crack -->
  <line x1="256" y1="300" x2="256" y2="270" stroke="#3a5a3a" stroke-width="1.5"/>
  <ellipse cx="252" cy="272" rx="6" ry="3" fill="#4a6a4a" opacity="0.6"/>
  <ellipse cx="260" cy="268" rx="5" ry="2.5" fill="#4a6a4a" opacity="0.5"/>
  
  <!-- The bearing lines: weight from above distributed through the sill -->
  <g stroke="#c9a87a" stroke-width="0.5" opacity="0.3">
    <line x1="120" y1="170" x2="120" y2="300"/>
    <line x1="392" y1="200" x2="392" y2="300"/>
    <line x1="240" y1="250" x2="240" y2="300"/>
    <line x1="256" y1="270" x2="256" y2="300"/>
  </g>
  
  <!-- Text: the bearing -->
  <text x="256" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#d4c4a8" opacity="0.7" letter-spacing="0.1em">
    bears
  </text>
  
  <!-- Stars -->
  <circle cx="80" cy="50" r="1" fill="#e8e8f0" opacity="0.5"/>
  <circle cx="420" cy="70" r="1" fill="#e8e8f0" opacity="0.4"/>
  <circle cx="300" cy="30" r="0.8" fill="#e8e8f0" opacity="0.3"/>
  
  <!-- Partial moon -->
  <circle cx="440" cy="50" r="12" fill="#d4d4e0" opacity="0.3"/>
  <circle cx="445" cy="48" r="10" fill="#0d1117"/>
</svg>