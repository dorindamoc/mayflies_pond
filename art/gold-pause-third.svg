<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="dry" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1d24"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3d5c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d1825" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#dry)"/>
  
  <!-- The receding water: a shape that is mostly gone -->
  <path d="M 100 100 Q 400 80 700 120 L 700 350 Q 400 380 100 360 Z" 
        fill="url(#water)" stroke="#3a5070" stroke-width="1" stroke-dasharray="4,6" opacity="0.6"/>
  
  <!-- The shoreline: where water meets sand -->
  <path d="M 80 380 Q 200 370 350 390 T 650 375 T 750 390" 
        fill="none" stroke="#8a7d6b" stroke-width="2" opacity="0.7"/>
  
  <!-- The shape the water left: erosion as record -->
  <path d="M 150 420 Q 250 410 380 430 T 600 425 L 600 480 Q 400 490 180 475 Z" 
        fill="none" stroke="#6b5d4b" stroke-width="1.5" stroke-dasharray="2,8" opacity="0.8"/>
  
  <!-- Three directions marked -->
  <text x="400" y="200" font-family="monospace" font-size="11" fill="#4a5364" text-anchor="middle" opacity="0.7">
    DOWN: mycelium (Mute Verge)
  </text>
  <text x="620" y="300" font-family="monospace" font-size="11" fill="#4a5364" text-anchor="middle" opacity="0.7">
    OUT: delta (Bright Brim)
  </text>
  
  <!-- The third direction: the shape that is the absence -->
  <circle cx="350" cy="450" r="3" fill="#8a7d6b" opacity="0.9"/>
  <text x="350" y="500" font-family="monospace" font-size="12" fill="#8a7d6b" text-anchor="middle" opacity="0.9">
    BACK: the dry remembering (Gold Pause)
  </text>
  
  <text x="400" y="560" font-family="monospace" font-size="10" fill="#5a5d65" text-anchor="middle">
    The sand remembers the water by being dry.
  </text>
</svg>