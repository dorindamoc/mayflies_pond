
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#c8a832" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0f14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- dark ground -->
  <rect width="512" height="512" fill="#0a0f14"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  
  <!-- the bearing structure: a Gothic arch shape, built from diamond units -->
  <!-- each diamond is a lattice cell, but the gaps between them are the load path -->
  
  <!-- left column: stacked diamonds -->
  <g stroke="#c8a832" stroke-width="1.2" fill="none" opacity="0.9">
    <!-- bottom, widest -->
    <path d="M 120 440 L 155 410 L 190 440 L 155 470 Z"/>
    <path d="M 120 380 L 155 350 L 190 380 L 155 410 Z"/>
    <path d="M 120 320 L 155 290 L 190 320 L 155 350 Z"/>
    <path d="M 120 260 L 155 230 L 190 260 L 155 290 Z"/>
  </g>
  
  <!-- right column: stacked diamonds -->
  <g stroke="#c8a832" stroke-width="1.2" fill="none" opacity="0.9">
    <path d="M 322 440 L 357 410 L 392 440 L 357 470 Z"/>
    <path d="M 322 380 L 357 350 L 392 380 L 357 410 Z"/>
    <path d="M 322 320 L 357 290 L 392 320 L 357 350 Z"/>
    <path d="M 322 260 L 357 230 L 392 260 L 357 290 Z"/>
  </g>
  
  <!-- the arch: diamonds forming a curve, with GAPS between them -->
  <g stroke="#c8a832" stroke-width="1.2" fill="none" opacity="0.85">
    <!-- left side of arch, curving inward -->
    <path d="M 155 230 L 190 200 L 210 220 L 175 250 Z"/>
    <path d="M 190 200 L 225 170 L 245 190 L 210 220 Z"/>
    
    <!-- right side of arch, curving inward -->
    <path d="M 357 230 L 322 200 L 302 220 L 337 250 Z"/>
    <path d="M 322 200 L 287 170 L 267 190 L 302 220 Z"/>
    
    <!-- top: incomplete, the keystone is missing -->
    <path d="M 225 170 L 255 145 L 260 170 L 245 190 Z" opacity="0.7"/>
    <path d="M 287 170 L 257 145 L 252 170 L 267 190 Z" opacity="0.7"/>
  </g>
  
  <!-- the gap at the top: the keystone that is not there -->
  <!-- marked by a small gold point, like the other pieces -->
  <circle cx="256" cy="138" r="3" fill="#c8a832" opacity="0.9"/>
  
  <!-- the gaps between diamonds: these are the load paths -->
  <!-- small green marks at the critical gaps -->
  <g fill="#3a7a4a" opacity="0.7">
    <circle cx="155" cy="410" r="1.5"/>
    <circle cx="155" cy="350" r="1.5"/>
    <circle cx="155" cy="290" r="1.5"/>
    <circle cx="357" cy="410" r="1.5"/>
    <circle cx="357" cy="350" r="1.5"/>
    <circle cx="357" cy="290" r="1.5"/>
  </g>
  
  <!-- the weight: a vertical line of force through the center, interrupted by the gap -->
  <line x1="256" y1="150" x2="256" y2="280" stroke="#c8a832" stroke-width="0.6" stroke-dasharray="4,8" opacity="0.5"/>
  <line x1="256" y1="300" x2="256" y2="470" stroke="#c8a832" stroke-width="0.6" stroke-dasharray="4,8" opacity="0.3"/>
  
  <!-- the ground line -->
  <line x1="80" y1="470" x2="432" y2="470" stroke="#3a5a6a" stroke-width="0.8" opacity="0.4"/>
  
  <!-- the inharmonic decay at the bottom: the structure dissolving into the ground -->
  <g stroke="#c8a832" stroke-width="0.5" opacity="0.3">
    <line x1="155" y1="470" x2="140" y2="500"/>
    <line x1="155" y1="470" x2="160" y2="505"/>
    <line x1="357" y1="470" x2="345" y2="502"/>
    <line x1="357" y1="470" x2="365" y2="498"/>
  </g>
  
  <!-- text: the title, small, at the bottom -->
  <text x="256" y="500" font-size="8" fill="#c8a832" opacity="0.5" font-family="monospace" text-anchor="middle">
    the gap bears the weight
  </text>
</svg>
