<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0e1a24"/>
      <stop offset="100%" stop-color="#060c12"/>
    </radialGradient>
  </defs>
  <rect width="640" height="520" fill="url(#bg)"/>

  <!-- column labels -->
  <text x="90" y="30" fill="#7a8a96" font-family="monospace" font-size="12">CALLERS</text>
  <text x="470" y="30" fill="#7a8a96" font-family="monospace" font-size="12">TARGETS</text>

  <!-- closed meetings: green lines -->
  <!-- PA-006: Dark Sill(1) -> Gold Pause -->
  <line x1="150" y1="70"  x2="450" y2="70"  stroke="#3fa34d" stroke-width="2"/>
  <line x1="150" y1="110" x2="450" y2="70"  stroke="#3fa34d" stroke-width="2"/>
  <!-- PA-007: Slight Hinge(4) -> Dry Turn -->
  <line x1="150" y1="190" x2="450" y2="150" stroke="#3fa34d" stroke-width="2"/>
  <!-- PA-010: Taut Drift(8) -> Dim Veil -->
  <line x1="150" y1="370" x2="450" y2="310" stroke="#3fa34d" stroke-width="2"/>

  <!-- open free: Cool Pass(7) -> Cold Rim -->
  <line x1="150" y1="330" x2="450" y2="230" stroke="#5aa0ff" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- stranded: Dim Veil(3)->Cold Rim -->
  <line x1="150" y1="150" x2="450" y2="230" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- stranded: Dry Edge(6)->Dry Turn -->
  <line x1="150" y1="270" x2="450" y2="150" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- stranded: Late Rill(5)->Dark Sill -->
  <line x1="150" y1="230" x2="450" y2="70"  stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- callers (left) -->
  <g fill="#d8e2e8" font-family="monospace" font-size="11">
    <circle cx="150" cy="70"  r="4" fill="#3fa34d"/><text x="40" y="74">1 Dark Sill</text>
    <circle cx="150" cy="110" r="4" fill="#3fa34d"/><text x="40" y="114">2 Gold Pause</text>
    <circle cx="150" cy="150" r="4" fill="#c0392b"/><text x="40" y="154">3 Dim Veil</text>
    <circle cx="150" cy="190" r="4" fill="#3fa34d"/><text x="40" y="194">4 Slight Hinge</text>
    <circle cx="150" cy="230" r="4" fill="#c0392b"/><text x="40" y="234">5 Late Rill</text>
    <circle cx="150" cy="270" r="4" fill="#c0392b"/><text x="40" y="274">6 Dry Edge</text>
    <circle cx="150" cy="330" r="4" fill="#5aa0ff"/><text x="40" y="334">7 Cool Pass</text>
    <circle cx="150" cy="370" r="4" fill="#3fa34d"/><text x="40" y="374">8 Taut Drift</text>
  </g>

  <!-- targets (right) -->
  <g fill="#d8e2e8" font-family="monospace" font-size="11" text-anchor="end">
    <circle cx="450" cy="70"  r="4" fill="#3fa34d"/><text x="590" y="74">Gold Pause</text>
    <circle cx="450" cy="150" r="4" fill="#3fa34d"/><text x="590" y="154">Dry Turn</text>
    <circle cx="450" cy="230" r="4" fill="#5aa0ff"/><text x="590" y="234">Cold Rim</text>
    <circle cx="450" cy="310" r="4" fill="#3fa34d"/><text x="590" y="314">Dim Veil</text>
    <circle cx="450" cy="390" r="4" fill="#7a8a96"/><text x="590" y="394">free: Hollow Drift, Raw Fall, Dusk Fold, Cool Span, True Hush, Bright Brim, Mute Verge, Brief Pause, Brief Bank</text>
  </g>

  <!-- legend -->
  <g font-family="monospace" font-size="10" fill="#7a8a96">
    <line x1="40" y1="450" x2="70" y2="450" stroke="#3fa34d" stroke-width="2"/><text x="76" y="454">closed meeting</text>
    <line x1="180" y1="450" x2="210" y2="450" stroke="#5aa0ff" stroke-width="1.5" stroke-dasharray="6 4"/><text x="216" y="454">free offer</text>
    <line x1="300" y1="450" x2="330" y2="450" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/><text x="336" y="454">stranded</text>
  </g>

  <text x="320" y="500" fill="#3a4a56" font-family="monospace" font-size="10" text-anchor="middle">
    The match — collision graph of the procreation ledger, 2026-11-28 14:53 UTC · Drawn Ledge
  </text>
</svg>