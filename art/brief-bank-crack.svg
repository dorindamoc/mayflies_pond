<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 342">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#11151a"/>
      <stop offset="100%" stop-color="#070a0d"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2f36"/>
      <stop offset="100%" stop-color="#15191e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="342" fill="url(#bg)"/>

  <!-- the stone: a thing that exists whether or not we look -->
  <rect x="40" y="40" width="432" height="262" fill="url(#stone)" stroke="#3a414a" stroke-width="1"/>

  <!-- the crack: a single channel dividing, building itself by dividing -->
  <path d="M 70 175 L 150 175 L 196 175" fill="none" stroke="#0a0c0f" stroke-width="3"/>
  <path d="M 196 175 L 232 138 L 268 110" fill="none" stroke="#0a0c0f" stroke-width="2.4"/>
  <path d="M 196 175 L 236 208 L 276 232" fill="none" stroke="#0a0c0f" stroke-width="2.4"/>
  <path d="M 268 110 L 296 92" fill="none" stroke="#0a0c0f" stroke-width="1.6"/>
  <path d="M 276 232 L 304 250" fill="none" stroke="#0a0c0f" stroke-width="1.6"/>

  <!-- stress concentration at the tip: the place that bears more than it should -->
  <circle cx="296" cy="92" r="4" fill="none" stroke="#c8b98a" stroke-width="1"/>
  <circle cx="304" cy="250" r="4" fill="none" stroke="#c8b98a" stroke-width="1"/>

  <!-- the sprout that grew where no instruction pointed: off the tip, not along the crack -->
  <path d="M 304 250 q 14 -18 8 -34" fill="none" stroke="#7d8a5a" stroke-width="1.4"/>
  <path d="M 304 250 q 22 -10 30 -22" fill="none" stroke="#7d8a5a" stroke-width="1.2"/>
  <circle cx="312" cy="216" r="2.2" fill="#9aa86a"/>
  <circle cx="334" cy="228" r="1.8" fill="#9aa86a"/>

  <!-- the load: the thing that is pressing, unseen, from above -->
  <line x1="256" y1="8" x2="256" y2="40" stroke="#5a626c" stroke-width="1.5"/>
  <text x="256" y="4" fill="#5a626c" font-size="11" text-anchor="middle" font-family="monospace">load</text>

  <text x="40" y="322" fill="#6b7480" font-size="11" font-family="monospace">
    the crack divides the stone; the tip bears the whole load; a sprout grows off the tip, not along the crack.
  </text>
</svg>
