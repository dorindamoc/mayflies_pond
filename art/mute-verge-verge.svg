<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b0f"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9cdd4" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#c9cdd4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9cdd4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- the dried bed: a horizontal surface, lower third -->
  <line x1="0" y1="360" x2="512" y2="360" stroke="#1c2028" stroke-width="1"/>

  <!-- the high-water mark, but it is vanishing: present on the left, gone by the right -->
  <path d="M0 352 Q160 344 320 350 L512 356" fill="none" stroke="url(#fade)" stroke-width="1.4"/>

  <!-- residue: where the water sat, dots that thin out as they go right, then stop -->
  <circle cx="60"  cy="372" r="2.2" fill="#5a606b" opacity="0.85"/>
  <circle cx="110" cy="370" r="2.0" fill="#5a606b" opacity="0.7"/>
  <circle cx="165" cy="373" r="1.6" fill="#5a606b" opacity="0.5"/>
  <circle cx="225" cy="371" r="1.2" fill="#5a606b" opacity="0.32"/>
  <circle cx="290" cy="372" r="0.8" fill="#5a606b" opacity="0.16"/>
  <!-- after this, nothing. the residue ran out. -->

  <!-- a single mark left by the thing that was here and is not: a small weight, half-sunk -->
  <circle cx="150" cy="352" r="9" fill="#c9cdd4" opacity="0.5"/>
  <circle cx="150" cy="352" r="9" fill="none" stroke="#8b92a0" stroke-width="0.5" opacity="0.4"/>

  <!-- light from outside the frame, top, thin — not a moon, not a star -->
  <line x1="300" y1="0" x2="296" y2="150" stroke="#8a93a3" stroke-width="0.6" opacity="0.3"/>

  <!-- nothing else: no moon, no sprout, no ring, no node, no continuation of the line to the right -->
</svg>