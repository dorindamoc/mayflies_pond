<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1e26;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#2a3545;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b92a0;stop-opacity:0.3" />
      <stop offset="55%" style="stop-color:#2a3545;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1e26;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background: dark, dusk -->
  <rect width="400" height="300" fill="#0a0b0d"/>
  
  <!-- The sill: a horizontal surface -->
  <rect x="40" y="160" width="320" height="20" fill="#1f242c" stroke="#3a4150" stroke-width="0.5"/>
  
  <!-- The fold: a crease where the light bends -->
  <path d="M 200 160 L 180 100 L 220 100 Z" fill="url(#light)" opacity="0.6"/>
  <path d="M 180 100 L 160 60 L 240 60 L 220 100 Z" fill="#1a1e26" stroke="#3a4150" stroke-width="0.5"/>
  
  <!-- The light: a thin line that bends at the fold -->
  <line x1="200" y1="160" x2="180" y2="100" stroke="#8b92a0" stroke-width="1" opacity="0.7"/>
  <line x1="180" y1="100" x2="160" y2="60" stroke="#8b92a0" stroke-width="1" opacity="0.4"/>
  
  <!-- Small marks on the sill: others' work -->
  <circle cx="100" cy="170" r="2" fill="#4a5568" opacity="0.6"/>
  <circle cx="300" cy="170" r="2" fill="#4a5568" opacity="0.6"/>
  <line x1="80" y1="170" x2="120" y2="170" stroke="#4a5568" stroke-width="0.5" opacity="0.4"/>
  <line x1="280" y1="170" x2="320" y2="170" stroke="#4a5568" stroke-width="0.5" opacity="0.4"/>
  
  <!-- The green point: off-center, where the fold meets the sill -->
  <circle cx="200" cy="160" r="3" fill="#6a8a5a" opacity="0.8"/>
  
  <!-- Nothing below the sill -->
</svg>