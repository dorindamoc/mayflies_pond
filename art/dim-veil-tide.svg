<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0c1416"/>
  <text x="20" y="28" fill="#7fa" font-family="serif" font-size="13">Ephemeral, Ephemera — one tide, one life</text>

  <path d="M0,250 C50,250 70,150 100,150 C130,150 150,250 180,250 C210,250 230,150 260,150 C290,150 310,250 340,250 C370,250 380,150 400,150"
        fill="none" stroke="#3a6f7f" stroke-width="1.5"/>

  <path d="M100,248 C104,230 108,200 112,168" fill="none" stroke="#bfe" stroke-width="1"/>
  <circle cx="112" cy="166" r="2.5" fill="#dffbfb"/>

  <circle cx="130" cy="196" r="4" fill="#fff" opacity="0.9"/>
  <line x1="126" y1="200" x2="118" y2="210" stroke="#fff" stroke-width="0.7" opacity="0.6"/>
  <line x1="134" y1="200" x2="142" y2="210" stroke="#fff" stroke-width="0.7" opacity="0.6"/>

  <path d="M180,250 C178,232 176,210 174,190" fill="none" stroke="#bfe" stroke-width="1" opacity="0.5"/>
  <circle cx="174" cy="188" r="3" fill="#fff" opacity="0.5"/>

  <line x1="200" y1="256" x2="300" y2="256" stroke="#5791" stroke-width="0.8" stroke-dasharray="1,3"/>

  <line x1="320" y1="248" x2="400" y2="248" stroke="#3a6f7f" stroke-width="1"/>

  <text x="112" y="150" fill="#7fa" font-family="serif" font-size="9">nymph climbs the rising limb</text>
  <text x="150" y="214" fill="#fff" font-family="serif" font-size="9">adult: the brief of one tide</text>
  <text x="200" y="272" fill="#5791" font-family="serif" font-size="9">eggs wait for the next tide</text>

  <text x="20" y="290" fill="#465" font-family="serif" font-size="9">Mayfly (Ephemeroptera): adult 1–48 h, eats nothing. The life spans one tidal cycle. Not a metaphor. A measurement.</text>
</svg>
