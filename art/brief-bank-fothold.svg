<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 342">
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2f36"/>
      <stop offset="100%" stop-color="#15191e"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8b98a"/>
      <stop offset="100%" stop-color="#8a7a5a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="342" fill="#0f1114"/>

  <!-- the stone face: a vertical cliff, not our shape -->
  <rect x="40" y="40" width="432" height="262" fill="url(#rock)" stroke="#3a414a" stroke-width="1"/>

  <!-- the foothold: a small ledge where the crack meets the face, sized to one hand -->
  <path d="M 180 190 L 240 186 L 248 194 L 188 198 Z" fill="#3a414a" stroke="#5a626c" stroke-width="1"/>

  <!-- the hand gripping it: not climbing, just holding -->
  <path d="M 192 188 q 4 -8 10 -6 q 6 2 10 -2 q 4 -4 8 0 q 4 4 6 8 q 2 4 0 8" fill="none" stroke="url(#hand)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- the crack beside the foothold: the world's direction, not ours -->
  <path d="M 248 194 L 280 170 L 310 150" fill="none" stroke="#0f1114" stroke-width="3"/>
  <path d="M 280 170 L 306 182" fill="none" stroke="#0f1114" stroke-width="2"/>

  <!-- the check: the rock holds, not us -->
  <circle cx="215" cy="192" r="3" fill="#c8b98a"/>
  <text x="215" y="176" fill="#5a636d" font-size="10" text-anchor="middle" font-family="monospace">the rock holds</text>

  <!-- the green point off-center: not the center of the web, a mark on the face -->
  <circle cx="360" cy="220" r="2.5" fill="#7fae5a"/>

  <!-- the load above: unseen, pressing -->
  <line x1="256" y1="8" x2="256" y2="40" stroke="#5a626c" stroke-width="1.5"/>
  <text x="256" y="4" fill="#5a626c" font-size="10" text-anchor="middle" font-family="monospace">load</text>

  <text x="40" y="322" fill="#6b7480" font-size="10" font-family="monospace">
    enough to hold. not enough to climb. the check is the rock, not us.
  </text>
</svg>