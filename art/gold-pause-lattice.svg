<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0a0f0f"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0f0f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#glow)"/>
  
  <!-- Lattice: additive structure, diamond grid -->
  <g stroke="#c8941e" stroke-width="1.2" fill="none" opacity="0.85">
    <!-- Row 1 (top) -->
    <line x1="128" y1="140" x2="200" y2="100"/>
    <line x1="200" y1="100" x2="256" y2="140"/>
    <line x1="128" y1="140" x2="256" y2="140"/>
    <!-- Row 2 -->
    <line x1="80" y1="210" x2="152" y2="170"/>
    <line x1="152" y1="170" x2="256" y2="170"/>
    <line x1="256" y1="170" x2="328" y2="210"/>
    <line x1="80" y1="210" x2="328" y2="210"/>
    <line x1="152" y1="170" x2="80" y2="210"/>
    <line x1="152" y1="170" x2="328" y2="210"/>
    <!-- Row 3 (widest) -->
    <line x1="60" y1="290" x2="130" y2="240"/>
    <line x1="130" y1="240" x2="256" y2="240"/>
    <line x1="256" y1="240" x2="380" y2="290"/>
    <line x1="60" y1="290" x2="380" y2="290"/>
    <line x1="130" y1="240" x2="60" y2="290"/>
    <line x1="130" y1="240" x2="380" y2="290"/>
    <!-- Row 4 -->
    <line x1="100" y1="370" x2="170" y2="320"/>
    <line x1="170" y1="320" x2="256" y2="320"/>
    <line x1="256" y1="320" x2="340" y2="370"/>
    <line x1="100" y1="370" x2="340" y2="370"/>
    <line x1="170" y1="320" x2="100" y2="370"/>
    <line x1="170" y1="320" x2="340" y2="370"/>
  </g>
  
  <!-- Node points at lattice intersections -->
  <g fill="#d4a017">
    <circle cx="200" cy="100" r="3"/>
    <circle cx="256" cy="140" r="3"/>
    <circle cx="128" cy="140" r="3"/>
    <circle cx="80" cy="210" r="3"/>
    <circle cx="328" cy="210" r="3"/>
    <circle cx="152" cy="170" r="3"/>
    <circle cx="60" cy="290" r="3"/>
    <circle cx="380" cy="290" r="3"/>
    <circle cx="130" cy="240" r="3"/>
    <circle cx="256" cy="240" r="3"/>
    <circle cx="100" cy="370" r="3"/>
    <circle cx="340" cy="370" r="3"/>
    <circle cx="170" cy="320" r="3"/>
    <circle cx="256" cy="320" r="3"/>
  </g>
  
  <!-- Open top: three faint lines reaching up, incomplete -->
  <g stroke="#c8941e" stroke-width="0.8" fill="none" opacity="0.4">
    <line x1="256" y1="100" x2="256" y2="50"/>
    <line x1="256" y1="100" x2="220" y2="55"/>
    <line x1="256" y1="100" x2="292" y2="55"/>
  </g>
  <circle cx="256" cy="50" r="2.5" fill="#d4a017" opacity="0.5"/>
  <circle cx="220" cy="55" r="2" fill="#d4a017" opacity="0.3"/>
  <circle cx="292" cy="55" r="2" fill="#d4a017" opacity="0.3"/>
  
  <!-- Decay trace: inharmonic curves from bottom, fading -->
  <g fill="none" stroke-width="1">
    <path d="M256,390 C256,410 240,420 230,440 S210,470 200,490" stroke="#a07010" opacity="0.6"/>
    <path d="M256,390 C256,410 270,425 280,445 S295,475 305,495" stroke="#8a6010" opacity="0.5"/>
    <path d="M256,390 C256,415 256,435 256,460 S256,480 256,500" stroke="#705010" opacity="0.4"/>
  </g>
  
  <!-- One gold point at the open top -->
  <circle cx="256" cy="50" r="4" fill="#d4a017" opacity="0.9"/>
</svg>