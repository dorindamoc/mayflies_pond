<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="wood" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="15%" stop-color="#6B4F12"/>
      <stop offset="30%" stop-color="#9B7924"/>
      <stop offset="45%" stop-color="#5B3F0A"/>
      <stop offset="60%" stop-color="#8B6914"/>
      <stop offset="75%" stop-color="#4B2F05"/>
      <stop offset="90%" stop-color="#7B5910"/>
      <stop offset="100%" stop-color="#3B1F02"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#1a1008"/>
  <!-- Tree ring cross-section: concentric rings, irregular like real wood -->
  <g transform="translate(200,200)">
    <!-- Outermost ring -->
    <ellipse cx="0" cy="0" rx="180" ry="175" fill="none" stroke="#4B2F05" stroke-width="3" opacity="0.9"/>
    <ellipse cx="-2" cy="1" rx="168" ry="162" fill="none" stroke="#7B5910" stroke-width="1.5" opacity="0.7"/>
    <!-- Ring 2 -->
    <ellipse cx="1" cy="-1" rx="155" ry="150" fill="none" stroke="#3B1F02" stroke-width="4" opacity="0.85"/>
    <ellipse cx="-1" cy="0" rx="145" ry="140" fill="none" stroke="#8B6914" stroke-width="1.2" opacity="0.6"/>
    <!-- Ring 3 -->
    <ellipse cx="-2" cy="1" rx="130" ry="128" fill="none" stroke="#5B3F0A" stroke-width="3.5" opacity="0.9"/>
    <ellipse cx="1" cy="-1" rx="120" ry="115" fill="none" stroke="#9B7924" stroke-width="1" opacity="0.55"/>
    <!-- Ring 4 -->
    <ellipse cx="0" cy="0" rx="105" ry="103" fill="none" stroke="#3B1F02" stroke-width="5" opacity="0.9"/>
    <ellipse cx="-1" cy="1" rx="96" ry="92" fill="none" stroke="#8B6914" stroke-width="1.3" opacity="0.6"/>
    <!-- Ring 5 -->
    <ellipse cx="1" cy="-1" rx="80" ry="78" fill="none" stroke="#6B4F12" stroke-width="3" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="72" ry="70" fill="none" stroke="#9B7924" stroke-width="1" opacity="0.5"/>
    <!-- Ring 6 -->
    <ellipse cx="-1" cy="1" rx="55" ry="53" fill="none" stroke="#3B1F02" stroke-width="4" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="48" ry="46" fill="none" stroke="#7B5910" stroke-width="1.2" opacity="0.6"/>
    <!-- Ring 7 -->
    <ellipse cx="1" cy="0" rx="35" ry="33" fill="none" stroke="#5B3F0A" stroke-width="3" opacity="0.85"/>
    <ellipse cx="0" cy="-1" rx="28" ry="27" fill="none" stroke="#8B6914" stroke-width="1" opacity="0.55"/>
    <!-- Ring 8 -->
    <ellipse cx="-1" cy="1" rx="18" ry="17" fill="none" stroke="#3B1F02" stroke-width="3.5" opacity="0.9"/>
    <!-- Pith -->
    <circle cx="0" cy="0" r="6" fill="#2a1a05"/>
    <!-- A crack running from pith outward, not a path but a fact of the wood -->
    <path d="M0,0 L2,-8 L5,-18 L3,-30 L8,-42 L6,-55 L10,-68 L8,-82 L12,-95 L10,-110 L14,-125 L12,-140 L15,-155 L13,-170 L16,-185" 
          fill="none" stroke="#1a0f03" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    <!-- A smaller crack branching off -->
    <path d="M6,-55 L-4,-62 L-12,-72 L-18,-85" 
          fill="none" stroke="#1a0f03" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>