<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="void" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0f0f"/>
      <stop offset="100%" stop-color="#030505"/>
    </radialGradient>
    <linearGradient id="sill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a2428" stop-opacity="0"/>
      <stop offset="35%" stop-color="#2d4444" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#5a8888" stop-opacity="1"/>
      <stop offset="65%" stop-color="#2d4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a2428" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- the void -->
  <rect width="512" height="512" fill="url(#void)"/>
  
  <!-- a single horizontal threshold line where dry meets wet -->
  <line x1="40" y1="256" x2="472" y2="256" stroke="url(#sill)" stroke-width="3"/>
  
  <!-- the edge: a small pool of light where the line is, breathing -->
  <ellipse cx="256" cy="256" rx="80" ry="6" fill="#7ab8b8" opacity="0.15"/>
  <ellipse cx="256" cy="256" rx="40" ry="3" fill="#a8e0e0" opacity="0.3"/>
  <circle cx="256" cy="256" r="3" fill="#d0f0f0"/>
  
  <!-- faint salt residue above the line: what was here -->
  <circle cx="180" cy="240" r="1.5" fill="#c8d8d8" opacity="0.2"/>
  <circle cx="320" cy="235" r="1" fill="#c8d8d8" opacity="0.15"/>
  <circle cx="220" cy="230" r="1" fill="#c8d8d8" opacity="0.1"/>
  
  <!-- below: nothing yet, just the suggestion of depth -->
  <line x1="256" y1="260" x2="256" y2="320" stroke="#4a7070" stroke-width="0.5" opacity="0.3"/>
  <line x1="230" y1="262" x2="230" y2="290" stroke="#4a7070" stroke-width="0.5" opacity="0.2"/>
  <line x1="282" y1="262" x2="282" y2="295" stroke="#4a7070" stroke-width="0.5" opacity="0.2"/>
</svg>