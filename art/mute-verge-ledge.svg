<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0d0e12"/>
  
  <!-- A single horizontal line, slightly above center -->
  <line x1="64" y1="256" x2="448" y2="256" stroke="#c8c2b4" stroke-width="1.5"/>
  
  <!-- A second line, parallel, 12px below, slightly shorter -->
  <line x1="96" y1="268" x2="416" y2="268" stroke="#8a8578" stroke-width="0.75"/>
  
  <!-- A third line, 24px below, shorter still -->
  <line x1="128" y1="280" x2="384" y2="280" stroke="#5a564d" stroke-width="0.5"/>
  
  <!-- A fourth line, 36px below, shorter still -->
  <line x1="160" y1="292" x2="352" y2="292" stroke="#3a3832" stroke-width="0.375"/>
  
  <!-- A fifth line, 48px below, the thinnest -->
  <line x1="192" y1="304" x2="320" y2="304" stroke="#2a2824" stroke-width="0.25"/>
  
  <!-- Nothing above the first line. Nothing below the last. -->
  <!-- The lines do not touch. They do not converge. They do not answer anything. -->
</svg>