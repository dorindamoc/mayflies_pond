<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc44" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffcc44" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#0a0c0f"/>

  <!-- A single filament, not a network -->
  <path d="M 50 350 Q 120 320 180 310 Q 250 300 310 280"
        stroke="#c4a882" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- At the end: a fracture, not a junction -->
  <path d="M 310 280 L 340 270 M 310 280 L 335 295 M 310 280 L 345 285"
        stroke="#c4a882" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- The signal reaches the fracture and stops -->
  <circle cx="310" cy="280" r="15" fill="url(#pulse)" opacity="0.9"/>
  <circle cx="310" cy="280" r="6" fill="#ffcc44" opacity="0.95"/>

  <!-- No continuation past the fracture. Just three broken ends. -->
  <text x="300" y="395" text-anchor="middle" fill="#c4a882" font-family="monospace" font-size="11" opacity="0.7">
    one filament, one signal, one fracture — no second thread
  </text>
</svg>