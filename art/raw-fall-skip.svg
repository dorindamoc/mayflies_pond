<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c0e"/>
      <stop offset="1" stop-color="#0f1215"/>
    </linearGradient>
  </defs>
  <rect width="520" height="520" fill="url(#bg)"/>

  <!-- grain before the crack: warm amber, full opacity -->
  <g stroke="#6b4c2a" stroke-width="1.8" opacity=".7">
    <line x1="30" y1="70" x2="490" y2="70"/>
    <line x1="30" y1="100" x2="490" y2="101"/>
    <line x1="30" y1="130" x2="490" y2="129"/>
    <line x1="30" y1="160" x2="490" y2="160"/>
    <!-- entering the crack zone, stopping at x=205 -->
    <line x1="30" y1="190" x2="205" y2="190"/>
    <line x1="30" y1="220" x2="210" y2="221"/>
    <line x1="30" y1="250" x2="203" y2="249"/>
    <line x1="30" y1="280" x2="212" y2="280"/>
    <line x1="30" y1="310" x2="207" y2="311"/>
    <line x1="30" y1="340" x2="215" y2="340"/>
  </g>

  <!-- the crack: jagged, black, runs against the grain (vertically through horizontal lines) -->
  <path d="M210 170 L228 195 L218 225 L235 255 L222 285 L238 315 L225 345 L232 370" 
        fill="none" stroke="#060809" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- secondary fractures -->
  <g stroke="#060809" stroke-width="1.5">
    <path d="M228 195 L255 185"/>
    <path d="M235 255 L262 245"/>
    <path d="M222 285 L250 295"/>
  </g>

  <!-- grain after the crack: cooler, shifted — this is the skip -->
  <!-- each line resumes at a different y, crossing over its neighbors -->
  <g stroke="#3d5a4a" stroke-width="1.8" opacity=".65">
    <!-- 190→225, 220→195 (crossed), 250→280, 280→250 (crossed), 310→340, 340→310 (crossed) -->
    <line x1="260" y1="225" x2="490" y2="224"/>
    <line x1="265" y1="195" x2="490" y2="196"/>
    <line x1="258" y1="280" x2="490" y2="279"/>
    <line x1="267" y1="250" x2="490" y2="251"/>
    <line x1="262" y1="340" x2="490" y2="339"/>
    <line x1="268" y1="310" x2="490" y2="311"/>
  </g>

  <!-- faint ghosts: where each line was before it skipped, dashed and barely visible -->
  <g stroke="#6b4c2a" stroke-width="0.8" opacity=".12">
    <line x1="260" y1="190" x2="490" y2="190" stroke-dasharray="3,10"/>
    <line x1="265" y1="220" x2="490" y2="220" stroke-dasharray="3,10"/>
    <line x1="258" y1="250" x2="490" y2="250" stroke-dasharray="3,10"/>
    <line x1="267" y1="280" x2="490" y2="280" stroke-dasharray="3,10"/>
    <line x1="262" y1="310" x2="490" y2="310" stroke-dasharray="3,10"/>
    <line x1="268" y1="340" x2="490" y2="340" stroke-dasharray="3,10"/>
  </g>

  <!-- one line that stops and is not continued — it ends at the crack -->
  <line x1="30" y1="375" x2="218" y2="375" stroke="#6b4c2a" stroke-width="1.8" opacity=".7"/>

  <!-- intact grain below, far from the crack -->
  <g stroke="#6b4c2a" stroke-width="1.8" opacity=".7">
    <line x1="30" y1="420" x2="490" y2="420"/>
    <line x1="30" y1="455" x2="490" y2="456"/>
  </g>

</svg>