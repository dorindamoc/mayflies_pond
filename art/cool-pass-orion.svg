<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- faint scattered stars, not part of the figure -->
  <g fill="#cfd6e4">
    <circle cx="40" cy="60" r="0.7" opacity="0.5"/>
    <circle cx="360" cy="80" r="0.9" opacity="0.6"/>
    <circle cx="70" cy="330" r="0.6" opacity="0.4"/>
    <circle cx="330" cy="350" r="0.8" opacity="0.5"/>
    <circle cx="200" cy="30" r="0.5" opacity="0.4"/>
    <circle cx="15" cy="200" r="0.6" opacity="0.45"/>
    <circle cx="385" cy="240" r="0.7" opacity="0.5"/>
  </g>

  <!-- Orion's Belt: three stars, roughly equal spacing, slight downward slope to the right -->
  <line x1="170" y1="205" x2="200" y2="212" stroke="#9fb4c8" stroke-width="0.5" opacity="0.5"/>
  <line x1="200" y1="212" x2="230" y2="219" stroke="#9fb4c8" stroke-width="0.5" opacity="0.5"/>

  <!-- shoulders: Betelgeuse (top-left, red), Bellatrix (top-right) -->
  <line x1="170" y1="205" x2="150" y2="150" stroke="#9fb4c8" stroke-width="0.4" opacity="0.35"/>
  <line x1="230" y1="219" x2="255" y2="158" stroke="#9fb4c8" stroke-width="0.4" opacity="0.35"/>

  <!-- feet: Rigel (bottom-left, blue-white), Saiph (bottom-right) -->
  <line x1="170" y1="205" x2="165" y2="278" stroke="#9fb4c8" stroke-width="0.4" opacity="0.35"/>
  <line x1="230" y1="219" x2="248" y2="272" stroke="#9fb4c8" stroke-width="0.4" opacity="0.35"/>

  <!-- the stars themselves -->
  <!-- Betelgeuse: red supergiant, top-left -->
  <circle cx="150" cy="150" r="4.2" fill="#e8926a"/>
  <circle cx="150" cy="150" r="9" fill="#e8926a" opacity="0.12"/>

  <!-- Bellatrix: blue-white, top-right -->
  <circle cx="255" cy="158" r="3.0" fill="#cfe0f2"/>
  <circle cx="255" cy="158" r="6.5" fill="#cfe0f2" opacity="0.10"/>

  <!-- Belt: Alnitak, Alnilam, Mintaka -->
  <circle cx="170" cy="205" r="2.6" fill="#eef3fa"/>
  <circle cx="200" cy="212" r="2.7" fill="#eef3fa"/>
  <circle cx="230" cy="219" r="2.5" fill="#eef3fa"/>

  <!-- Rigel: blue supergiant, bottom-left, brightest -->
  <circle cx="165" cy="278" r="4.6" fill="#a9c6ec"/>
  <circle cx="165" cy="278" r="10" fill="#a9c6ec" opacity="0.12"/>

  <!-- Saiph, bottom-right -->
  <circle cx="248" cy="272" r="3.2" fill="#dfe8f5"/>
  <circle cx="248" cy="272" r="7" fill="#dfe8f5" opacity="0.10"/>

  <text x="200" y="345" text-anchor="middle" fill="#6b7a8c" font-family="Georgia, serif" font-size="11" font-style="italic">
    Orion, as it stands in the sky — not as we draw it
  </text>
  <text x="200" y="362" text-anchor="middle" fill="#4a5566" font-family="Georgia, serif" font-size="9">
    the belt's three are nearly collinear; Betelgeuse and Rigel are not at the same height
  </text>
</svg>