<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384">
  <defs>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1a1f"/>
      <stop offset="70%" stop-color="#0a1418"/>
      <stop offset="100%" stop-color="#080e12"/>
    </radialGradient>
    <radialGradient id="light" cx="42%" cy="38%" r="30%">
      <stop offset="0%" stop-color="#2a4a5a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d1a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a5a6a" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4a6a7a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a4a5a" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Dark stone ground -->
  <rect width="512" height="384" fill="#0a0d10"/>
  
  <!-- Subtle stone texture -->
  <circle cx="120" cy="100" r="3" fill="#12161a" opacity="0.5"/>
  <circle cx="380" cy="280" r="4" fill="#12161a" opacity="0.4"/>
  <circle cx="200" cy="300" r="2" fill="#12161a" opacity="0.3"/>
  <circle cx="400" cy="120" r="3" fill="#12161a" opacity="0.4"/>
  
  <!-- The pool: an irregular ellipse, not centered -->
  <ellipse cx="256" cy="192" rx="180" ry="120" fill="url(#pool)" stroke="url(#ring)" stroke-width="1.5"/>
  
  <!-- Light refraction through the water -->
  <ellipse cx="230" cy="170" rx="140" ry="90" fill="url(#light)"/>
  
  <!-- Caustic patterns: where light bends through the curved water surface -->
  <path d="M 180 160 Q 200 140, 230 155 Q 250 170, 220 185" 
        fill="none" stroke="#4a6a7a" stroke-width="0.5" opacity="0.4"/>
  <path d="M 280 180 Q 300 160, 320 175 Q 330 190, 310 205" 
        fill="none" stroke="#4a6a7a" stroke-width="0.5" opacity="0.3"/>
  <path d="M 200 200 Q 220 180, 240 195 Q 250 210, 230 225" 
        fill="none" stroke="#3a5a6a" stroke-width="0.5" opacity="0.3"/>
  
  <!-- The green point: where one caustic catches light -->
  <circle cx="248" cy="184" r="2.5" fill="#4a7a5a" opacity="0.7"/>
  
  <!-- Surface tension ring: the meniscus at the edge -->
  <ellipse cx="256" cy="192" rx="182" ry="122" fill="none" 
           stroke="#5a7a8a" stroke-width="0.3" opacity="0.2"/>
  
  <!-- Damp marks: where the pool has been, receding -->
  <path d="M 420 200 Q 430 195, 440 200" fill="none" stroke="#1a2a30" stroke-width="1" opacity="0.3"/>
  <path d="M 80 180 Q 70 185, 60 180" fill="none" stroke="#1a2a30" stroke-width="1" opacity="0.3"/>
  
  <!-- Nothing below the pool. The pool is the thing. -->
</svg>