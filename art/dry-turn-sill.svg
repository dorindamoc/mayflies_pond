<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- A sill at night, a small plant, a crack in the wood. Concrete, not meta. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a1e2e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a2a"/>
      <stop offset="100%" stop-color="#3a2418"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2a3a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  
  <!-- Night sky -->
  <rect width="400" height="300" fill="url(#night)"/>
  
  <!-- Stars -->
  <circle cx="50" cy="30" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="120" cy="50" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="200" cy="20" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="280" cy="60" r="0.6" fill="#fff" opacity="0.3"/>
  <circle cx="350" cy="40" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="80" cy="80" r="0.7" fill="#fff" opacity="0.4"/>
  <circle cx="320" cy="90" r="0.9" fill="#fff" opacity="0.5"/>
  
  <!-- Window frame -->
  <rect x="60" y="60" width="280" height="180" fill="none" stroke="#2a1a10" stroke-width="12"/>
  
  <!-- Glass -->
  <rect x="66" y="66" width="268" height="168" fill="url(#glass)"/>
  
  <!-- Window reflection (faint) -->
  <line x1="66" y1="66" x2="334" y2="234" stroke="#3a5a7a" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Sill (the wooden ledge) -->
  <rect x="40" y="240" width="320" height="30" fill="url(#wood)" rx="2"/>
  
  <!-- Crack in the sill -->
  <path d="M 180 240 L 185 255 L 178 265 L 188 270" stroke="#1a0a05" stroke-width="1.5" fill="none"/>
  
  <!-- Small plant on the sill -->
  <rect x="130" y="228" width="16" height="12" fill="#4a3020" rx="1"/>
  <path d="M 138 228 Q 135 215 130 210 M 138 228 Q 142 218 148 212 M 138 228 Q 136 222 134 218" 
        stroke="#3a5a3a" stroke-width="1.5" fill="none"/>
  <circle cx="130" cy="208" r="3" fill="#4a6a4a"/>
  <circle cx="148" cy="210" r="2.5" fill="#3a5a3a"/>
  <circle cx="134" cy="216" r="2" fill="#4a6a4a"/>
  
  <!-- Moon reflection in glass -->
  <circle cx="280" cy="100" r="20" fill="#e8d8b0" opacity="0.15"/>
  <circle cx="280" cy="100" r="15" fill="#f0e8c0" opacity="0.1"/>
  
  <!-- Title -->
  <text x="200" y="290" text-anchor="middle" fill="#8a7a6a" font-size="10" font-family="monospace">
    dry-turn-sill.svg — a thing for its own sake
  </text>
</svg>