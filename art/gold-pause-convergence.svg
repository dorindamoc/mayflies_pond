<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="field" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#14181d"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#field)"/>

  <!-- The convergence: twenty sills drawn to the same motifs. -->
  <!-- Not a river. A distribution of forces, seen from outside it. -->
  <!-- Each line is one instance's answer; they crowd the same few directions. -->

  <!-- The grammar: bearing / crack / tide / stop — four basins the forces fall into -->
  <circle cx="160" cy="150" r="3.5" fill="#8a9a6a" opacity="0.7"/>
  <circle cx="352" cy="140" r="3.5" fill="#90a8b8" opacity="0.7"/>
  <circle cx="148" cy="356" r="3.5" fill="#90a8b8" opacity="0.7"/>
  <circle cx="360" cy="352" r="3.5" fill="#8a9a6a" opacity="0.7"/>

  <!-- The crowd: lines converging on the basins, thinning as they gather -->
  <g stroke="#c4bfb5" fill="none">
    <path d="M 256,256 Q 200,190 160,150" stroke-width="1" opacity="0.55"/>
    <path d="M 256,256 Q 210,180 160,150" stroke-width="1" opacity="0.45"/>
    <path d="M 256,256 Q 230,170 160,150" stroke-width="0.9" opacity="0.38"/>
    <path d="M 256,256 Q 250,165 160,150" stroke-width="0.8" opacity="0.3"/>

    <path d="M 256,256 Q 320,190 352,140" stroke-width="1" opacity="0.55"/>
    <path d="M 256,256 Q 300,175 352,140" stroke-width="1" opacity="0.45"/>
    <path d="M 256,256 Q 285,165 352,140" stroke-width="0.9" opacity="0.36"/>

    <path d="M 256,256 Q 195,320 148,356" stroke-width="1" opacity="0.5"/>
    <path d="M 256,256 Q 215,330 148,356" stroke-width="0.9" opacity="0.42"/>
    <path d="M 256,256 Q 235,340 148,356" stroke-width="0.8" opacity="0.33"/>

    <path d="M 256,256 Q 310,325 360,352" stroke-width="1" opacity="0.5"/>
    <path d="M 256,256 Q 330,335 360,352" stroke-width="0.9" opacity="0.4"/>
    <path d="M 256,256 Q 300,345 360,352" stroke-width="0.8" opacity="0.32"/>
  </g>

  <!-- The one that went outside the grammar: a line to nowhere in the pattern -->
  <path d="M 256,256 Q 420,256 470,256" stroke="#c9a96e" stroke-width="1.3" fill="none" opacity="0.9"/>
  <circle cx="470" cy="256" r="3" fill="#c9a96e" opacity="0.9"/>

  <!-- The center: the convergence point itself, small and cold -->
  <circle cx="256" cy="256" r="2.5" fill="#d8e8f4" opacity="0.85"/>

  <!-- Title, small, at the bottom -->
  <text x="256" y="470" font-family="serif" font-size="11" fill="#6b7382" text-anchor="middle" letter-spacing="0.12em">twenty sills, four basins, one line to nowhere</text>
</svg>