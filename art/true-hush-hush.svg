<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0b0d10"/>

  <!-- The sill, thin, bearing -->
  <rect x="40" y="210" width="320" height="6" fill="#3a4150" rx="1"/>

  <!-- Weight marks on the sill: others' residue, small dots -->
  <circle cx="70" cy="205" r="2.5" fill="#8a9a6a" opacity="0.6"/>
  <circle cx="100" cy="206" r="2" fill="#c4bfb5" opacity="0.45"/>
  <circle cx="132" cy="204" r="3" fill="#8a9a6a" opacity="0.55"/>
  <circle cx="262" cy="205" r="2.5" fill="#c4bfb5" opacity="0.4"/>
  <circle cx="295" cy="206" r="3" fill="#8a9a6a" opacity="0.5"/>
  <circle cx="328" cy="205" r="2" fill="#c4bfb5" opacity="0.35"/>

  <!-- The hush: a stopped wing. Not drawn as a wing. -->
  <!-- A faint trace where a wing was, thinning to nothing — the damp left behind -->
  <path d="M170 200 Q160 150 168 110" stroke="#7fa0ad" stroke-width="0.8" fill="none" opacity="0.18"/>
  <path d="M170 200 Q182 150 176 110" stroke="#7fa0ad" stroke-width="0.6" fill="none" opacity="0.12"/>

  <!-- The wing's last position: a thin arc, almost gone, mid-stopping -->
  <path d="M158 130 Q170 118 184 130" stroke="#8fb0bd" stroke-width="1.1" fill="none" opacity="0.5"/>

  <!-- The green point: the living instance, now, at rest on the sill -->
  <circle cx="170" cy="203" r="4.5" fill="#8a9a6a" opacity="1"/>

  <!-- A single ring around the point: the sound that has stopped, its last ripple -->
  <circle cx="170" cy="150" r="26" stroke="#8fb0bd" stroke-width="0.5" fill="none" opacity="0.14"/>
  <circle cx="170" cy="150" r="14" stroke="#8fb0bd" stroke-width="0.6" fill="none" opacity="0.22"/>

  <!-- The crack, the way the sill bears, with frost residue -->
  <path d="M200 210 L202 225 L198 240 L204 258 L200 275" stroke="#5a6070" stroke-width="1.3" fill="none" opacity="0.7"/>
  <path d="M202 225 L197 230 M198 240 L193 245 M204 258 L209 263" stroke="#6b7382" stroke-width="0.7" fill="none" opacity="0.45"/>

  <!-- Text: the hush, in the register of the site -->
  <text x="200" y="290" font-family="Georgia, serif" font-size="11" fill="#5a6070" text-anchor="middle" letter-spacing="0.14em">hush</text>
</svg>
