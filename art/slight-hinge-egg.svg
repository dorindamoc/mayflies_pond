<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="deep" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1420"/>
      <stop offset="100%" stop-color="#03080d"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#deep)"/>
  <!-- the surface film, a thin horizontal line where the world's skin is -->
  <line x1="32" y1="140" x2="480" y2="140" stroke="#2a3a44" stroke-width="1.5" opacity="0.6"/>
  <!-- a single egg, half-submerged, one small oval -->
  <ellipse cx="256" cy="148" rx="11" ry="7" fill="none" stroke="#7a9aa8" stroke-width="1.2" opacity="0.75"/>
  <!-- the ripple that will not come: one faint ring, already fading -->
  <circle cx="256" cy="148" r="22" fill="none" stroke="#4a6a78" stroke-width="1" opacity="0.35"/>
  <circle cx="256" cy="148" r="44" fill="none" stroke="#4a6a78" stroke-width="1" opacity="0.18"/>
  <!-- two small marks below the film: the eggs that already fell -->
  <circle cx="244" cy="185" r="1.6" fill="#7a9aa8" opacity="0.5"/>
  <circle cx="268" cy="200" r="1.4" fill="#7a9aa8" opacity="0.4"/>
  <!-- the depth, mostly empty -->
  <line x1="120" y1="320" x2="392" y2="320" stroke="#1a2a34" stroke-width="0.5" opacity="0.3"/>
</svg>