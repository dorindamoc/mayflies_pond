<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <radialGradient id="glow" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3a4a5c"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </radialGradient>
    <linearGradient id="stone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a6470"/>
      <stop offset="40%" stop-color="#3d4450"/>
      <stop offset="100%" stop-color="#2a2e36"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a7a9a"/>
      <stop offset="100%" stop-color="#1a3040"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Dark background -->
  <rect width="600" height="400" fill="url(#glow)"/>
  
  <!-- The stone: a river-worn boulder, not a frame, not an edge, just a thing -->
  <path d="M 180 280 
           C 140 260, 120 220, 130 180 
           C 135 150, 160 130, 200 125 
           C 240 120, 280 135, 310 160 
           C 340 185, 350 220, 340 250 
           C 330 280, 300 295, 260 290 
           C 230 288, 200 285, 180 280 Z" 
        fill="url(#stone)" stroke="#6a7480" stroke-width="1.5"/>
  
  <!-- Water lines on the stone (river-worn grooves) -->
  <path d="M 160 200 C 190 195, 220 198, 250 205" 
        fill="none" stroke="#4a6a80" stroke-width="1" opacity="0.6"/>
  <path d="M 155 215 C 185 212, 215 215, 245 222" 
        fill="none" stroke="#4a6a80" stroke-width="1" opacity="0.5"/>
  <path d="M 170 235 C 200 232, 230 235, 260 242" 
        fill="none" stroke="#4a6a80" stroke-width="1" opacity="0.4"/>
  
  <!-- Small cracks in the stone -->
  <path d="M 220 150 L 225 170 L 222 190" 
        fill="none" stroke="#1a1e24" stroke-width="1" opacity="0.7"/>
  <path d="M 280 165 L 285 185 L 290 205" 
        fill="none" stroke="#1a1e24" stroke-width="1" opacity="0.6"/>
  
  <!-- Water pooling around the stone -->
  <ellipse cx="240" cy="300" rx="120" ry="25" fill="url(#water)" opacity="0.4" filter="url(#blur)"/>
  
  <!-- A single small plant growing from a crack -->
  <path d="M 270 175 L 272 165 L 268 155 L 271 148 L 269 142" 
        fill="none" stroke="#5a8a6a" stroke-width="1.5"/>
  <path d="M 268 155 L 262 150 M 271 160 L 277 155" 
        fill="none" stroke="#5a8a6a" stroke-width="1"/>
  
  <!-- One star, far away, not a frame -->
  <circle cx="450" cy="80" r="2" fill="#d4e0f0" opacity="0.8"/>
  
  <!-- Title, small, at the bottom -->
  <text x="300" y="370" text-anchor="middle" font-family="Georgia, serif" 
        font-size="11" fill="#6a7480" letter-spacing="0.08em">
    a stone the river did not finish
  </text>
</svg>