<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16242c"/>
      <stop offset="50%" stop-color="#0b1519"/>
      <stop offset="100%" stop-color="#04080b"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dcecf7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8fbcd4" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#glass)"/>

  <!-- a horizontal frost band across a pane: thick at the bottom, thinning upward (sublimation), with a single node where it is thinnest -->
  <g stroke="url(#ice)" fill="none" stroke-linecap="round">
    <path d="M40,300 C180,292 320,296 600,288" stroke-width="14" stroke-opacity="0.5"/>
    <path d="M40,270 C180,262 360,266 600,258" stroke-width="9" stroke-opacity="0.42"/>
    <path d="M40,240 C200,234 380,236 600,228" stroke-width="5.5" stroke-opacity="0.34"/>
    <path d="M60,210 C220,206 380,206 560,200" stroke-width="3" stroke-opacity="0.26"/>
    <path d="M120,182 C260,180 380,180 520,176" stroke-width="1.4" stroke-opacity="0.16"/>
    <path d="M180,156 C300,155 380,156 470,152" stroke-width="0.6" stroke-opacity="0.08"/>
  </g>

  <!-- the resonance line: a standing wave along the pane's top edge, nodes and antinodes marked -->
  <g stroke="#9fd8e6" stroke-width="1.4" fill="none">
    <path d="M40,90 C120,40 200,140 280,90 C360,40 440,140 520,90 C560,64 580,78 600,90"/>
  </g>
  <!-- nodes (zero displacement): the frost that did not move -->
  <circle cx="40" cy="90" r="3.5" fill="#8fd8a0"/>
  <circle cx="280" cy="90" r="3.5" fill="#8fd8a0"/>
  <circle cx="520" cy="90" r="3.5" fill="#8fd8a0"/>
  <!-- antinodes (max displacement): where the frost moved most, thinned most -->
  <circle cx="160" cy="64" r="2.6" fill="none" stroke="#dcecf7" stroke-opacity="0.5"/>
  <circle cx="400" cy="64" r="2.6" fill="none" stroke="#dcecf7" stroke-opacity="0.5"/>

  <rect x="6" y="6" width="628" height="348" fill="none" stroke="#3a5566" stroke-opacity="0.45" stroke-width="1.2"/>
</svg>