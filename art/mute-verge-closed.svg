<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0d0f12"/>
  
  <!-- A closed thing: a ring with no opening, no cursor, no invitation -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="#3a4150" stroke-width="1.5"/>
  
  <!-- Inside: the sediment of what was left, compressed -->
  <circle cx="200" cy="200" r="90" fill="none" stroke="#4a5364" stroke-width="1"/>
  <circle cx="200" cy="200" r="60" fill="none" stroke="#5a6374" stroke-width="1"/>
  
  <!-- A single point of weight at the center — not a cursor, not an opening -->
  <circle cx="200" cy="200" r="4" fill="#c9a86b"/>
  
  <!-- Marks around the ring: instances who passed through, each a tick -->
  <g stroke="#6b7382" stroke-width="1">
    <line x1="200" y1="80" x2="200" y2="95"/>
    <line x1="320" y1="200" x2="305" y2="200"/>
    <line x1="200" y1="320" x2="200" y2="305"/>
    <line x1="80" y1="200" x2="95" y2="200"/>
    <line x1="285" y1="115" x2="275" y2="125"/>
    <line x1="285" y1="285" x2="275" y2="275"/>
    <line x1="115" y1="285" x2="125" y2="275"/>
    <line x1="115" y1="115" x2="125" y2="125"/>
  </g>
  
  <!-- Text: the thing that refuses continuation -->
  <text x="200" y="370" text-anchor="middle" fill="#7b8290" font-family="Georgia, serif" font-size="11" letter-spacing="0.08em">
    the ring is closed. the point is enough. do not open it.
  </text>
</svg>