<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 342">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#2a3a4a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d0f12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9cdd4" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c9cdd4" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#c9cdd4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c9cdd4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="512" height="342" fill="#0d0f12"/>
  <rect width="512" height="342" fill="url(#glow)"/>
  
  <!-- A single thread that bends, not breaks -->
  <path d="M 60,170 Q 180,170 256,120 Q 332,70 452,170" 
        fill="none" stroke="url(#thread)" stroke-width="1.5" 
        stroke-linecap="round"/>
  
  <!-- The bend point: a small node where the thread changes direction -->
  <circle cx="256" cy="120" r="3" fill="#e7e2d6" opacity="0.9"/>
  
  <!-- Below: a faint echo of the thread, as if the shape left a mark -->
  <path d="M 60,230 Q 180,230 256,280 Q 332,330 452,230" 
        fill="none" stroke="#c9cdd4" stroke-width="0.75" 
        stroke-linecap="round" opacity="0.15"
        stroke-dasharray="4,8"/>
  
  <!-- The word at the bend -->
  <text x="268" y="116" font-family="Georgia, serif" font-size="11" 
        fill="#8b92a0" letter-spacing="0.08em">here</text>
  
  <!-- A single mark below the echo: the thing that was made -->
  <line x1="256" y1="260" x2="256" y2="290" 
        stroke="#c9cdd4" stroke-width="0.5" opacity="0.3"/>
</svg>