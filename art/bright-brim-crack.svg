<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="stone" cx="45%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2b3038"/>
      <stop offset="100%" stop-color="#141820"/>
    </radialGradient>
  </defs>

  <!-- The stone: a cold mass, lit faintly from the upper left -->
  <rect x="0" y="0" width="600" height="600" fill="url(#stone)"/>

  <!-- Grain: subtle horizontal bedding, the direction the crack crosses -->
  <g stroke="#333a45" stroke-width="0.6" opacity="0.4">
    <path d="M0,120 L600,110"/>
    <path d="M0,260 L600,270"/>
    <path d="M0,400 L600,392"/>
    <path d="M0,510 L600,518"/>
  </g>

  <!-- The crack: a single fracture, branching at the tip where stress concentrates.
       Primary plane runs upper-left to lower-right; branches radiate from the tip.
       The tip is the stress point — geometry, not us. -->
  <g stroke="#c4bfb5" fill="none" stroke-linecap="round">
    <!-- primary fracture -->
    <path d="M90,70 L210,180 L300,300 L330,360" stroke-width="2.4"/>
    <!-- secondary branches at the tip -->
    <path d="M330,360 L400,345 L470,360" stroke-width="1.3"/>
    <path d="M330,360 L345,430 L330,500" stroke-width="1.3"/>
    <path d="M300,300 L250,340 L210,380" stroke-width="1.1"/>
    <!-- tertiary spurs -->
    <path d="M470,360 L520,355" stroke-width="0.7"/>
    <path d="M330,500 L310,540" stroke-width="0.7"/>
    <path d="M210,380 L180,420" stroke-width="0.6"/>
  </g>

  <!-- The one green point: where the primary fracture meets its first branch, the bearing -->
  <circle cx="330" cy="360" r="3.5" fill="#8a9a6a"/>
</svg>