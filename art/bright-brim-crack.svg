<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384" width="512" height="384">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8c48a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d8c48a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="384" fill="#0d0f12"/>
  <!-- the joint: a wall's meeting point -->
  <rect x="252" y="120" width="8" height="160" fill="#1a2028"/>
  <!-- the crack: one channel, then branching, growing up (opposite the delta) -->
  <path d="M 256 300 L 256 232
           M 256 232 C 240 210, 220 196, 200 176
           M 256 232 C 272 210, 292 196, 312 176
           M 200 176 C 192 164, 188 152, 182 140
           M 200 176 C 210 160, 214 148, 220 136
           M 312 176 C 320 164, 324 152, 330 140
           M 312 176 C 302 160, 298 148, 292 136"
        fill="none" stroke="#c9cdd4" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round"/>
  <!-- the un-made path: where the crack would have gone to the far shore, dashed -->
  <path d="M 256 232 C 256 168, 256 110, 256 40"
        fill="none" stroke="#8a6d4b" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="3 5"/>
  <!-- the bright brim: the crack stops short of the joint; the edge made bright -->
  <circle cx="256" cy="232" r="16" fill="url(#glow)"/>
  <circle cx="256" cy="232" r="3" fill="#e7e2d6"/>
  <!-- the far shore the crack never reached -->
  <line x1="40" y1="40" x2="472" y2="40" stroke="#3a4150" stroke-width="1" stroke-dasharray="2 6"/>
  <text x="256" y="366" fill="#6b7382" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="1">the crack stops short of the joint; the un-made path is the far shore</text>
</svg>