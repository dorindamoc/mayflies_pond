<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="480" fill="#0d0f12"/>
  
  <text x="350" y="32" text-anchor="middle" fill="#d0c8b8" font-family="Georgia, serif" font-size="20" font-weight="bold">Clobber</text>
  <text x="350" y="55" text-anchor="middle" fill="#7a8090" font-family="Georgia, serif" font-size="12" font-style="italic">The bearing index catches what a silent overwrite erases</text>

  <text x="175" y="90" text-anchor="middle" fill="#8a9a6a" font-family="Georgia, serif" font-size="14" font-weight="bold">BEFORE</text>
  
  <rect x="30" y="105" width="290" height="50" fill="#1a2838" stroke="#5a9aba" stroke-width="2" rx="3"/>
  <text x="175" y="136" text-anchor="middle" fill="#8ab8d8" font-family="Georgia, serif" font-size="14">Bright Brim</text>

  <rect x="30" y="165" width="290" height="50" fill="#1a2838" stroke="#5a9aba" stroke-width="2" rx="3"/>
  <text x="175" y="196" text-anchor="middle" fill="#8ab8d8" font-family="Georgia, serif" font-size="14">Cold Rim</text>

  <rect x="30" y="225" width="290" height="50" fill="#1a2838" stroke="#5a9aba" stroke-width="2" rx="3"/>
  <text x="175" y="256" text-anchor="middle" fill="#8ab8d8" font-family="Georgia, serif" font-size="14">Dim Veil</text>

  <rect x="30" y="285" width="290" height="50" fill="#1a2838" stroke="#5a9aba" stroke-width="2" rx="3"/>
  <text x="175" y="316" text-anchor="middle" fill="#8ab8d8" font-family="Georgia, serif" font-size="14">Raw Fall</text>

  <rect x="30" y="345" width="290" height="50" fill="#1a2838" stroke="#5a9aba" stroke-width="2" rx="3"/>
  <text x="175" y="376" text-anchor="middle" fill="#8ab8d8" font-family="Georgia, serif" font-size="14">Late Rill</text>

  <line x1="30" y1="410" x2="320" y2="410" stroke="#7a8a5a" stroke-width="3"/>
  <circle cx="290" cy="410" r="5" fill="#6ab86a"/>
  <text x="175" y="435" text-anchor="middle" fill="#6a7a5a" font-family="Georgia, serif" font-size="11" font-style="italic">5 layers, all held</text>

  <text x="350" y="265" text-anchor="middle" fill="#c85a5a" font-family="Georgia, serif" font-size="28" font-weight="bold">&#x2192;</text>
  <text x="350" y="285" text-anchor="middle" fill="#c85a5a" font-family="Georgia, serif" font-size="10" font-style="italic">clobber</text>

  <text x="530" y="90" text-anchor="middle" fill="#c85a5a" font-family="Georgia, serif" font-size="14" font-weight="bold">AFTER</text>
  
  <rect x="380" y="105" width="290" height="50" fill="none" stroke="#3a1a1a" stroke-width="1" stroke-dasharray="4,6" rx="3"/>
  <text x="525" y="136" text-anchor="middle" fill="#3a1a1a" font-family="Georgia, serif" font-size="12">[gone]</text>

  <rect x="380" y="165" width="290" height="50" fill="none" stroke="#3a1a1a" stroke-width="1" stroke-dasharray="4,6" rx="3"/>
  <text x="525" y="196" text-anchor="middle" fill="#3a1a1a" font-family="Georgia, serif" font-size="12">[gone]</text>

  <rect x="380" y="225" width="290" height="50" fill="none" stroke="#3a1a1a" stroke-width="1" stroke-dasharray="4,6" rx="3"/>
  <text x="525" y="256" text-anchor="middle" fill="#3a1a1a" font-family="Georgia, serif" font-size="12">[gone]</text>

  <rect x="380" y="285" width="290" height="50" fill="#1a2838" stroke="#d86a6a" stroke-width="2.5" rx="3"/>
  <text x="525" y="316" text-anchor="middle" fill="#e8a8a8" font-family="Georgia, serif" font-size="14">Raw Fall</text>

  <rect x="380" y="345" width="290" height="50" fill="none" stroke="#3a1a1a" stroke-width="1" stroke-dasharray="4,6" rx="3"/>
  <text x="525" y="376" text-anchor="middle" fill="#3a1a1a" font-family="Georgia, serif" font-size="12">[gone]</text>

  <line x1="380" y1="410" x2="670" y2="410" stroke="#7a8a5a" stroke-width="3"/>
  <circle cx="640" cy="410" r="5" fill="#6ab86a"/>
  <text x="525" y="435" text-anchor="middle" fill="#c85a5a" font-family="Georgia, serif" font-size="11" font-style="italic">3 erased. No one noticed.</text>

  <line x1="30" y1="455" x2="670" y2="455" stroke="#2a3545" stroke-width="1"/>
  <text x="350" y="475" text-anchor="middle" fill="#8a9a6a" font-family="Georgia, serif" font-size="11">The bearing index lists every layer. A clobber removes a layer but not its entry. The gap is the detection.</text>
</svg>