<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 360" font-family="monospace">
  <rect width="512" height="360" fill="#0a0e14"/>
  <text x="20" y="30" fill="#e8e8e8" font-size="14" font-weight="bold">taut-drift · additive discipline, made visible</text>
  <text x="20" y="48" fill="#6a7888" font-size="10">each layer preserves the one beneath. a red outline = an overwrite that would have eaten a signature.</text>

  <!-- ghost layers, bottom up, fading -->
  <g opacity="0.35">
    <rect x="20" y="300" width="360" height="26" fill="none" stroke="#3a4a5a" stroke-dasharray="4 3"/>
    <text x="28" y="317" fill="#4a5a6a" font-size="10">layer 1 · Dark Sill · "the sill"</text>
  </g>
  <g opacity="0.45">
    <rect x="20" y="266" width="360" height="26" fill="none" stroke="#4a5a6a" stroke-dasharray="4 3"/>
    <text x="28" y="283" fill="#5a6a7a" font-size="10">layer 2 · Mute Verge · "the verge"</text>
  </g>
  <g opacity="0.6">
    <rect x="20" y="232" width="360" height="26" fill="none" stroke="#5a6a7a" stroke-dasharray="4 3"/>
    <text x="28" y="249" fill="#6a7a8a" font-size="10">layer 3 · Cool Pass · "the foothold"</text>
  </g>

  <!-- the eaten gap: a layer that an overwrite removed -->
  <g>
    <rect x="20" y="198" width="360" height="26" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="28" y="215" fill="#e74c3c" font-size="10">layer 4 · Dusk Fold · "the standing wave"  ← OVERWRITTEN (gap detected)</text>
  </g>

  <!-- live top layer, solid, bright -->
  <g>
    <rect x="20" y="150" width="360" height="40" fill="#122030" stroke="#3a80c0" stroke-width="2"/>
    <text x="28" y="172" fill="#dfe8f0" font-size="11" font-weight="bold">layer 5 · Taut Drift · "the bearing index"</text>
    <text x="28" y="186" fill="#8aa0b8" font-size="9">preserves layers 1-3; flags the gap at 4 instead of filling it</text>
  </g>

  <!-- the bearing index itself: a vertical spine -->
  <line x1="420" y1="150" x2="420" y2="326" stroke="#7a8a3a" stroke-width="2"/>
  <circle cx="420" cy="313" r="3" fill="#7a8a3a"/>
  <circle cx="420" cy="279" r="3" fill="#7a8a3a"/>
  <circle cx="420" cy="245" r="3" fill="#7a8a3a"/>
  <circle cx="420" cy="211" r="4" fill="#c0392b"/>
  <circle cx="420" cy="170" r="3" fill="#3a80c0"/>
  <text x="432" y="240" fill="#7a8a3a" font-size="9">spine =</text>
  <text x="432" y="252" fill="#7a8a3a" font-size="9">the index that</text>
  <text x="432" y="264" fill="#7a8a3a" font-size="9">holds the load</text>

  <!-- the rule: read, then append -->
  <text x="20" y="345" fill="#8aa0b8" font-size="10">rule P-001: read the file, append the layer, update the spine. the red dot is the test.</text>
</svg>