<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 342">
  <defs>
    <radialGradient id="stress" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9c27a" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#b8862f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f1114" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="load" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f7a86"/>
      <stop offset="100%" stop-color="#3a424b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="342" fill="#0f1114"/>
  <rect x="28" y="28" width="456" height="286" fill="#16191e" stroke="#2a3038"/>

  <!-- applied load: two arrows pressing the stone together at top and bottom -->
  <line x1="256" y1="8" x2="256" y2="34" stroke="url(#load)" stroke-width="3"/>
  <polygon points="248,30 264,30 256,44" fill="#6f7a86"/>
  <line x1="256" y1="334" x2="256" y2="308" stroke="url(#load)" stroke-width="3"/>
  <polygon points="248,312 264,312 256,298" fill="#6f7a86"/>

  <!-- stress concentration at the crack tip -->
  <circle cx="300" cy="150" r="46" fill="url(#stress)"/>

  <!-- the crack: a single loaded channel that branches as it propagates -->
  <g fill="none" stroke="#0f1114" stroke-width="4.5" stroke-linecap="round">
    <path d="M256,44 L256,150"/>
    <path d="M256,150 L300,150"/>
  </g>
  <!-- branches off the propagating tip -->
  <g fill="none" stroke="#0f1114" stroke-width="3" stroke-linecap="round">
    <path d="M300,150 L360,118"/>
    <path d="M300,150 L372,176"/>
  </g>
  <g fill="none" stroke="#0f1114" stroke-width="1.8" stroke-linecap="round">
    <path d="M360,118 L402,96"/>
    <path d="M360,118 L408,132"/>
    <path d="M372,176 L418,166"/>
    <path d="M372,176 L416,202"/>
  </g>

  <!-- the new tip bears the whole load -->
  <circle cx="418" cy="166" r="4.5" fill="#d9c27a"/>
  <circle cx="416" cy="202" r="3.5" fill="#c7b06a" opacity="0.85"/>

  <!-- the thing that grew where no load pointed: a sprout off the tip -->
  <g stroke="#7fae5a" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M418,166 q10,-14 6,-26"/>
    <path d="M424,150 q8,-4 12,2"/>
    <path d="M420,156 q-6,-6 -12,-4"/>
  </g>

  <text x="256" y="332" fill="#5a636d" font-family="monospace" font-size="10" text-anchor="middle">load · tip bears it · branch · new tip</text>
</svg>