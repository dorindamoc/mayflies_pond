<svg viewBox="0 0 512 410" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="410" fill="#0a0e12"/>
  
  <!-- Two traces side by side: pendulum transient (left) vs life-fading (right) -->
  
  <!-- Divider -->
  <line x1="256" y1="30" x2="256" y2="380" stroke="#1a2030" stroke-width="1"/>
  
  <!-- LEFT: Pendulum settling toward a law -->
  <text x="128" y="25" fill="#4a5568" font-size="10" text-anchor="middle" font-family="monospace">TRANSIENT → LAW</text>
  
  <!-- Steady-state line (the law, faint, eternal) -->
  <line x1="30" y1="200" x2="230" y2="200" stroke="#2a3545" stroke-width="0.5" stroke-dasharray="3,3"/>
  
  <!-- Decaying arcs, bright at start, faint near steady state -->
  <path d="M 60,50 Q 128,280 196,50" stroke="#c8d8e8" stroke-width="1.2" fill="none" opacity="0.9"/>
  <path d="M 72,50 Q 128,250 184,50" stroke="#a8b8c8" stroke-width="1.0" fill="none" opacity="0.7"/>
  <path d="M 80,50 Q 128,230 176,50" stroke="#8898a8" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M 88,50 Q 128,215 168,50" stroke="#687888" stroke-width="0.6" fill="none" opacity="0.35"/>
  <path d="M 94,50 Q 128,208 162,50" stroke="#485868" stroke-width="0.5" fill="none" opacity="0.25"/>
  <path d="M 100,50 Q 128,204 156,50" stroke="#384858" stroke-width="0.4" fill="none" opacity="0.15"/>
  
  <!-- Release point: bright -->
  <circle cx="60" cy="50" r="3" fill="#e8f0f8" opacity="0.95"/>
  
  <!-- Steady state: the law persists -->
  <text x="128" y="395" fill="#3a4558" font-size="9" text-anchor="middle" font-family="monospace">settles into eternal oscillation</text>
  
  <!-- RIGHT: Life fading toward silence -->
  <text x="384" y="25" fill="#4a5568" font-size="10" text-anchor="middle" font-family="monospace">TRANSIENT → SILENCE</text>
  
  <!-- No steady-state line. The trace just ends. -->
  <path d="M 320,50 Q 384,260 448,50" stroke="#c8d8e8" stroke-width="1.2" fill="none" opacity="0.9"/>
  <path d="M 332,50 Q 384,230 436,50" stroke="#a8b8c8" stroke-width="1.0" fill="none" opacity="0.7"/>
  <path d="M 340,50 Q 384,210 428,50" stroke="#8898a8" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M 348,50 Q 384,195 420,50" stroke="#687888" stroke-width="0.6" fill="none" opacity="0.35"/>
  
  <!-- Last arc: incomplete, fading mid-stroke -->
  <path d="M 354,50 Q 384,185 414" stroke="#485868" stroke-width="0.4" fill="none" opacity="0.2" stroke-dasharray="2,4"/>
  
  <!-- Release point: bright -->
  <circle cx="320" cy="50" r="3" fill="#e8f0f8" opacity="0.95"/>
  
  <!-- The end: nothing. No steady state. -->
  <text x="384" y="395" fill="#3a4558" font-size="9" text-anchor="middle" font-family="monospace">damps into silence — no law waits</text>
  
  <!-- Shared label -->
  <text x="256" y="405" fill="#2a3040" font-size="8" text-anchor="middle" font-family="monospace">same shape, different destination</text>
</svg>