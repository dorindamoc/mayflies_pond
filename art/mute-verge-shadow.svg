<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 410">
  <rect width="512" height="410" fill="#0a0e14"/>
  
  <!-- Left: transient damping into law -->
  <text x="128" y="30" text-anchor="middle" fill="#4a5568" font-family="monospace" font-size="11">transient → law</text>
  
  <!-- Damped pendulum arcs -->
  <g stroke="#c8d6e5" stroke-width="1.2" fill="none" opacity="0.9">
    <path d="M 88,60 Q 128,180 168,60"/>
    <path d="M 92,60 Q 128,160 164,60" opacity="0.7"/>
    <path d="M 96,60 Q 128,140 160,60" opacity="0.5"/>
    <path d="M 100,60 Q 128,120 156,60" opacity="0.35"/>
    <path d="M 104,60 Q 128,100 152,60" opacity="0.25"/>
  </g>
  
  <!-- Steady-state law: dashed horizontal -->
  <line x1="60" y1="220" x2="196" y2="220" stroke="#5a6a7a" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="128" y="240" text-anchor="middle" fill="#5a6a7a" font-family="monospace" font-size="9">steady state</text>
  
  <!-- Right: transient into silence -->
  <text x="384" y="30" text-anchor="middle" fill="#4a5568" font-family="monospace" font-size="11">transient → end</text>
  
  <!-- Damped arcs, last one incomplete -->
  <g stroke="#c8d6e5" stroke-width="1.2" fill="none" opacity="0.9">
    <path d="M 344,60 Q 384,180 424,60"/>
    <path d="M 348,60 Q 384,160 420,60" opacity="0.7"/>
    <path d="M 352,60 Q 384,140 416,60" opacity="0.5"/>
    <path d="M 356,60 Q 384,120 412,60" opacity="0.35"/>
  </g>
  
  <!-- Last arc: incomplete, fading mid-stroke -->
  <path d="M 360,60 Q 384,100" stroke="#c8d6e5" stroke-width="1.2" fill="none" opacity="0.2" stroke-linecap="round"/>
  
  <!-- No steady-state line. Just absence. -->
  <line x1="316" y1="220" x2="452" y2="220" stroke="#0a0e14" stroke-width="1" opacity="0"/>
  <text x="384" y="240" text-anchor="middle" fill="#3a4550" font-family="monospace" font-size="9">—</text>
  
  <!-- Divider -->
  <line x1="256" y1="50" x2="256" y2="350" stroke="#2a3040" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Bottom: the question -->
  <text x="256" y="390" text-anchor="middle" fill="#4a5568" font-family="monospace" font-size="10">same shape · different destination · both true</text>
</svg>