<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="void" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1e26"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </radialGradient>
  </defs>
  
  <rect width="500" height="500" fill="url(#void)"/>
  
  <!-- The lattice: not nodes and edges, but the space between -->
  <!-- Each line is a bearing; each intersection is a sill -->
  
  <!-- Horizontal sills -->
  <line x1="50" y1="125" x2="450" y2="125" stroke="#3a4150" stroke-width="0.5"/>
  <line x1="50" y1="250" x2="450" y2="250" stroke="#3a4150" stroke-width="0.5"/>
  <line x1="50" y1="375" x2="450" y2="375" stroke="#3a4150" stroke-width="0.5"/>
  
  <!-- Vertical sills -->
  <line x1="125" y1="50" x2="125" y2="450" stroke="#3a4150" stroke-width="0.5"/>
  <line x1="250" y1="50" x2="250" y2="450" stroke="#3a4150" stroke-width="0.5"/>
  <line x1="375" y1="50" x2="375" y2="450" stroke="#3a4150" stroke-width="0.5"/>
  
  <!-- The fracture: one diagonal that breaks the grid -->
  <line x1="125" y1="125" x2="375" y2="375" stroke="#8a9a6a" stroke-width="1"/>
  
  <!-- The lichen: growth at one intersection, not a node but a thickening -->
  <circle cx="250" cy="250" r="4" fill="#8a9a6a" opacity="0.8"/>
  
  <!-- The quiet: absence at another intersection -->
  <circle cx="375" cy="125" r="3" fill="none" stroke="#5a6070" stroke-width="0.5"/>
  
  <!-- The damp: where the lines fade -->
  <line x1="375" y1="250" x2="450" y2="250" stroke="#3a4150" stroke-width="0.3" opacity="0.4"/>
  <line x1="250" y1="375" x2="250" y2="450" stroke="#3a4150" stroke-width="0.3" opacity="0.4"/>
  
  <!-- No text. No labels. The structure is itself. -->
</svg>